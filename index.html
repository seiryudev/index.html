<!DOCTYPE html>
<html lang="pt-AO" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sistema Áurea — Ecossistema Escolar (EXorg MT)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          },
          colors: {
            obsidian: 'var(--bg-obsidian, #070b12)',
            slateDark: 'var(--bg-slate-dark, #0d131f)',
            surface: 'var(--bg-surface, #141d2e)',
            surfaceAlt: 'var(--bg-surface-alt, #1c283e)',
            borderLine: 'var(--border-line, #26354f)',
            accent: 'var(--accent-hex, #38bdf8)',
            accentSoft: 'var(--accent-soft, #7dd3fc)',
            emeraldGlow: '#34d399',
            amberGlow: '#fbbf24',
            roseGlow: '#fb7185'
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg-obsidian: #070b12;
      --bg-slate-dark: #0d131f;
      --bg-surface: #141d2e;
      --bg-surface-alt: #1c283e;
      --border-line: #26354f;
      --text-primary: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-hex: #38bdf8;
      --accent-soft: #7dd3fc;
      --accent-ring: rgba(56, 189, 248, 0.35);
      --accent-tint: rgba(56, 189, 248, 0.14);
      --ui-scale: 1;
      --card-radius: 1.5rem;
      --card-pad: 1.25rem;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html.theme-light {
      color-scheme: light;
      --bg-obsidian: #f1f5f9;
      --bg-slate-dark: #ffffff;
      --bg-surface: #f8fafc;
      --bg-surface-alt: #e2e8f0;
      --border-line: #cbd5e1;
      --text-primary: #0f172a;
      --text-muted: #475569;
    }

    * { box-sizing: border-box; }

    html {
      font-size: calc(16px * var(--ui-scale));
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-obsidian);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    html.theme-light .text-white { color: #0f172a !important; }
    html.theme-light .text-slate-100,
    html.theme-light .text-slate-200 { color: #1e293b !important; }
    html.theme-light .text-slate-300,
    html.theme-light .text-slate-400 { color: #475569 !important; }
    html.theme-light .accent-solid { color: #ffffff !important; }

    /* Evita zoom automático no Safari/iOS ao focar inputs */
    input, select, textarea {
      font-size: 16px !important;
    }

    @media (min-width: 768px) {
      input, select, textarea {
        font-size: 14px !important;
      }
    }

    .safe-pt { padding-top: max(0.65rem, var(--safe-top)); }
    .safe-pb { padding-bottom: max(1rem, var(--safe-bottom)); }

    .reformed-card {
      border-radius: var(--card-radius) !important;
      padding: var(--card-pad) !important;
      transition: all 0.25s ease;
    }

    .tactile-btn {
      min-height: 44px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease, filter 0.12s ease;
    }
    .tactile-btn:hover { filter: brightness(1.06); }
    .tactile-btn:active { transform: scale(0.97); }

    .accent-solid {
      background-color: var(--accent-hex);
      color: #06101b;
    }
    .accent-solid:hover {
      background-color: var(--accent-soft);
    }
    .accent-text { color: var(--accent-hex); }
    .accent-soft-text { color: var(--accent-soft); }
    .accent-pill {
      background-color: var(--accent-tint);
      border-color: var(--accent-ring);
      color: var(--accent-soft);
    }

    .nav-pill.active {
      background-color: var(--accent-hex);
      color: #06101b;
      font-weight: 800;
      box-shadow: 0 4px 16px var(--accent-ring);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-obsidian); }
    ::-webkit-scrollbar-thumb { background: var(--border-line); border-radius: 9999px; }

    @media print {
      .no-print { display: none !important; }
      body { background: #ffffff !important; color: #0f172a !important; }
      .print-card {
        background: #ffffff !important;
        color: #0f172a !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Notificação Flutuante Limpa -->
  <div id="toastBox" class="no-print pointer-events-none fixed top-20 right-4 left-4 sm:left-auto z-50 hidden max-w-md rounded-2xl border border-borderLine bg-slateDark/95 px-4 py-3 text-xs sm:text-sm text-white shadow-2xl backdrop-blur">
    <div class="flex items-start gap-2.5">
      <span id="toastIndicator" class="mt-1 h-2.5 w-2.5 shrink-0 rounded-full bg-accent"></span>
      <p id="toastText" class="leading-snug"></p>
    </div>
  </div>

  <!-- Cabeçalho Principal (Zero elementos técnicos visíveis na vista de aluno) -->
  <header id="appHeader" class="no-print sticky top-0 z-40 border-b border-borderLine bg-slateDark/95 backdrop-blur safe-pt">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-3 py-2.5 sm:px-6">
      <!-- Emblema Institucional (Duplo clique/toque abre o acesso restrito por PIN sem poluir a interface) -->
      <div id="institutionalBrandTrigger" class="flex items-center gap-2.5 min-w-0 cursor-pointer select-none" title="Sistema Áurea — Ecossistema Escolar">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl border border-accent/40 bg-surface font-mono text-sm font-extrabold accent-soft-text shadow-inner">
          ÁU
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 class="truncate text-sm sm:text-base font-extrabold tracking-tight text-white">Sistema Áurea</h1>
            <span class="rounded-md border accent-pill px-1.5 py-0.5 font-mono text-[10px] font-bold">EXorg MT</span>
          </div>
          <p id="headerSubInfo" class="truncate font-mono text-[11px] text-slate-400">8.ª Classe • Ensino Secundário Geral</p>
        </div>
      </div>

      <!-- Controlos Limpos da Vista Ativa -->
      <div id="headerRightControls" class="flex items-center gap-1.5 sm:gap-2 shrink-0"></div>
    </div>

    <!-- Barra de Navegação Dinâmica conforme o Perfil Ativo -->
    <nav id="mainNavBar" class="mx-auto flex max-w-7xl items-center gap-1.5 overflow-x-auto px-3 pb-2.5 sm:px-6" aria-label="Navegação do Ecossistema"></nav>
  </header>

  <!-- Área Principal de Conteúdo -->
  <main id="mainViewport" class="mx-auto w-full max-w-7xl flex-1 px-3 py-4 sm:px-6 sm:py-6 pb-28 safe-pb"></main>

  <!-- Assistente S.A.G.A. (Limpo para alunos; motor de auto-reforma visual ativo) -->
  <div id="sagaDrawer" class="no-print fixed inset-0 z-50 hidden items-end sm:items-center justify-end bg-black/75 backdrop-blur-xs">
    <div class="flex h-[88vh] sm:h-[82vh] w-full sm:max-w-lg flex-col rounded-t-3xl sm:rounded-3xl sm:mr-5 border border-borderLine bg-slateDark shadow-2xl overflow-hidden">
      <!-- Cabeçalho do S.A.G.A. -->
      <div class="flex items-center justify-between gap-2 border-b border-borderLine bg-surface px-4 py-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="h-2.5 w-2.5 rounded-full bg-emeraldGlow"></span>
            <h2 class="text-sm font-extrabold text-white">S.A.G.A. — Tutor Escolar</h2>
          </div>
          <p id="sagaHeaderSubtitle" class="truncate text-[11px] text-slate-300">Apoio ao estudo, notas e ambiente</p>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" data-action="saga-rollback-ui" title="Restaurar visual original" class="tactile-btn rounded-xl border border-borderLine bg-obsidian px-2.5 py-1.5 text-[11px] font-semibold text-slate-300 hover:border-accent">
            Restaurar Visual
          </button>
          <button type="button" data-action="clear-saga-chat" title="Limpar conversa" class="tactile-btn rounded-xl border border-borderLine bg-obsidian px-2.5 py-1.5 text-[11px] font-semibold text-slate-300">
            Limpar
          </button>
          <button type="button" data-action="toggle-saga" title="Fechar S.A.G.A." class="tactile-btn rounded-xl border border-borderLine bg-obsidian px-3 py-1.5 text-xs font-bold text-white">
            Fechar
          </button>
        </div>
      </div>

      <!-- Sugestões Educativas e de Ambiente (Sem termos técnicos) -->
      <div class="flex items-center gap-1.5 overflow-x-auto border-b border-borderLine bg-obsidian/70 px-3 py-2">
        <button type="button" data-saga-quick="Mostra as minhas notas e média atual" class="tactile-btn shrink-0 rounded-lg border border-borderLine bg-surface px-2.5 py-1 text-[11px] font-semibold text-slate-200 hover:border-accent">
          Minhas Notas
        </button>
        <button type="button" data-saga-quick="Cria um plano de estudo para a 8.ª classe" class="tactile-btn shrink-0 rounded-lg border border-borderLine bg-surface px-2.5 py-1 text-[11px] font-semibold text-slate-200 hover:border-accent">
          Plano de Estudo
        </button>
        <button type="button" data-saga-quick="Muda o tema visual para esmeralda" class="tactile-btn shrink-0 rounded-lg border border-borderLine bg-surface px-2.5 py-1 text-[11px] font-semibold text-slate-200 hover:border-accent">
          Cor Esmeralda
        </button>
        <button type="button" data-saga-quick="Aumenta o tamanho da letra" class="tactile-btn shrink-0 rounded-lg border border-borderLine bg-surface px-2.5 py-1 text-[11px] font-semibold text-slate-200 hover:border-accent">
          Aumentar Letra
        </button>
      </div>

      <!-- Mensagens -->
      <div id="sagaChatScroll" class="flex-1 space-y-3 overflow-y-auto p-4 text-xs sm:text-sm"></div>

      <!-- Input do S.A.G.A. -->
      <form id="sagaChatForm" class="flex items-center gap-2 border-t border-borderLine bg-surface p-3 safe-pb">
        <input id="sagaPromptInput" type="text" autocomplete="off" placeholder="Pergunta sobre matérias, notas ou pede um ajuste visual..." class="min-h-[46px] flex-1 rounded-xl border border-borderLine bg-obsidian px-3.5 py-2 text-white placeholder-slate-500 focus:border-accent focus:outline-none" />
        <button type="submit" class="tactile-btn accent-solid rounded-xl px-4 py-2.5 text-xs sm:text-sm font-extrabold shrink-0">
          Enviar
        </button>
      </form>
    </div>
  </div>

  <!-- Modal Discreto de PIN de Acesso (4 Dígitos — Sem Dicas dos Códigos) -->
  <div id="pinAccessModal" class="no-print fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4 backdrop-blur-xs">
    <div class="w-full max-w-sm rounded-3xl border border-borderLine bg-slateDark p-6 space-y-5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-borderLine pb-3">
        <div>
          <h2 class="text-base font-extrabold text-white">Acesso Institucional</h2>
          <p class="text-xs text-slate-400">Introduz o código numérico de 4 dígitos.</p>
        </div>
        <button type="button" data-action="close-pin-modal" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3 py-1.5 text-xs font-bold text-slate-200">
          Fechar
        </button>
      </div>

      <form id="pinAccessForm" class="space-y-4">
        <div>
          <input
            id="pinCodeInput"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="4"
            autocomplete="off"
            placeholder="••••"
            class="min-h-[54px] w-full rounded-2xl border border-borderLine bg-obsidian px-4 py-3 text-center font-mono text-2xl font-extrabold tracking-[0.6em] text-white placeholder-slate-600 focus:border-accent focus:outline-none"
          />
        </div>
        <button type="submit" class="tactile-btn accent-solid w-full rounded-xl py-3 text-xs sm:text-sm font-extrabold">
          Confirmar Acesso
        </button>
      </form>
    </div>
  </div>

  <!-- Modal de Cores (Para o utilizador personalizar o ambiente) -->
  <div id="themeModal" class="no-print fixed inset-0 z-50 hidden items-center justify-center bg-black/75 p-4 backdrop-blur-xs">
    <div class="w-full max-w-md rounded-3xl border border-borderLine bg-slateDark p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-borderLine pb-3">
        <div>
          <h2 class="text-base font-bold text-white">Ambiente Visual</h2>
          <p class="text-xs text-slate-400">Escolhe a paleta de estudo que preferes.</p>
        </div>
        <button type="button" data-action="close-theme-modal" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3 py-1.5 text-xs font-bold text-slate-200">
          Fechar
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2" id="themePresetsBox"></div>

      <div class="grid grid-cols-2 gap-2">
        <button type="button" data-action="set-surface-mode" data-mode="dark" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3 py-2.5 text-xs font-bold text-white">
          Modo Escuro
        </button>
        <button type="button" data-action="set-surface-mode" data-mode="light" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3 py-2.5 text-xs font-bold text-white">
          Modo Claro
        </button>
      </div>
    </div>
  </div>

  <script>
    /**
     * =========================================================================
     * SISTEMA ÁUREA — ECOSSISTEMA ESCOLAR (EXorg MT)
     * Arquitetura com Isolamento Estrito de Papéis:
     * - 'student'  : Vista limpa (Academy, Lado 0, Manager, Boletim, Chat Turma, S.A.G.A.)
     * - '1841'     : Docente / Pedagógico (Lançamento de Notas 0-20, Assiduidade, Acompanhamento)
     * - '2013'     : Núcleo Técnico & Engenharia (API Gemini, Provas/Telemetria, Reforma S.A.G.A., Backup)
     * - '2012'     : Moderação & Comunidade (Controlo total dos Chats Públicos dos alunos)
     * =========================================================================
     */

    window.__AUREA_MEM_STORE = window.__AUREA_MEM_STORE || {};
    const STORE_KEY = 'AUREA_ECOSYSTEM_V5_PRESENTATION';

    function storageRead(key) {
      try {
        if (window.localStorage) {
          const val = window.localStorage.getItem(key);
          if (val !== null) {
            window.__AUREA_MEM_STORE[key] = val;
            return val;
          }
        }
      } catch (e) {}
      return Object.prototype.hasOwnProperty.call(window.__AUREA_MEM_STORE, key)
        ? window.__AUREA_MEM_STORE[key]
        : null;
    }

    function storageWrite(key, value) {
      const str = String(value);
      window.__AUREA_MEM_STORE[key] = str;
      try {
        if (window.localStorage) {
          window.localStorage.setItem(key, str);
        }
      } catch (e) {}
    }

    // Disciplinas do Currículo Angolano (8.ª Classe — Ensino Secundário Geral)
    const SUBJECTS_8_CLASSE = [
      'Matemática',
      'Língua Portuguesa',
      'Física',
      'Química',
      'Biologia',
      'História',
      'Geografia',
      'Língua Inglesa',
      'Educação Visual e Plástica',
      'Educação Física'
    ];

    const THEME_OPTIONS = [
      { name: 'Ciano Áurea', hex: '#38bdf8', soft: '#7dd3fc' },
      { name: 'Esmeralda', hex: '#34d399', soft: '#6ee7b7' },
      { name: 'Ouro Solar', hex: '#fbbf24', soft: '#fde68a' },
      { name: 'Violeta', hex: '#a78bfa', soft: '#ddd6fe' }
    ];

    const DEFAULT_FRONTEND_REFORM = {
      surfaceMode: 'dark',
      accentName: 'Ciano Áurea',
      accentHex: '#38bdf8',
      accentSoft: '#7dd3fc',
      uiScale: 1,
      density: 'comfortable', // 'comfortable' | 'compact' | 'spacious'
      showWelcomeBanner: true,
      layoutOrder: ['academy', 'lado0', 'manager', 'boletim', 'chat'],
      reformHistory: []
    };

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function nowClock() {
      return new Date().toLocaleTimeString('pt-AO', { hour: '2-digit', minute: '2-digit' });
    }

    function nowFullDateTime() {
      const d = new Date();
      return `${d.toLocaleDateString('pt-AO')} ${nowClock()}`;
    }

    let toastTimer = null;
    function showToast(msg, type = 'info') {
      const box = document.getElementById('toastBox');
      const txt = document.getElementById('toastText');
      const dot = document.getElementById('toastIndicator');
      if (!box || !txt || !dot) return;

      txt.textContent = msg;
      dot.className = `mt-1 h-2.5 w-2.5 shrink-0 rounded-full ${
        type === 'success' ? 'bg-emeraldGlow' : type === 'warn' ? 'bg-amberGlow' : type === 'error' ? 'bg-roseGlow' : 'bg-accent'
      }`;
      box.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => box.classList.add('hidden'), 3800);
    }

    // Cálculos Académicos Angolanos (Escala 0 a 20 Valores)
    function calcTrimesterMT(mac, npp, npt) {
      const a = Number(mac);
      const b = Number(npp);
      const c = Number(npt);
      if (!Number.isFinite(a) || !Number.isFinite(b) || !Number.isFinite(c)) return 0;
      return Math.round(((a + b + c) / 3) * 10) / 10;
    }

    function calcFinalSubjectAverage(gradesObj) {
      if (!gradesObj) return 0;
      const t1 = calcTrimesterMT(gradesObj.t1?.mac, gradesObj.t1?.npp, gradesObj.t1?.npt);
      const t2 = calcTrimesterMT(gradesObj.t2?.mac, gradesObj.t2?.npp, gradesObj.t2?.npt);
      const t3 = calcTrimesterMT(gradesObj.t3?.mac, gradesObj.t3?.npp, gradesObj.t3?.npt);
      return Math.round(((t1 + t2 + t3) / 3) * 10) / 10;
    }

    function classifyScore20(val) {
      const n = Number(val || 0);
      if (n >= 16) return { label: 'Muito Bom (Dispensado)', code: 'MB', badge: 'border-emeraldGlow/40 bg-emerald-950/35 text-emeraldGlow' };
      if (n >= 14) return { label: 'Bom (Aprovado)', code: 'BOM', badge: 'border-emeraldGlow/40 bg-emerald-950/35 text-emeraldGlow' };
      if (n >= 10) return { label: 'Suficiente (Aprovado)', code: 'APROV', badge: 'border-accent/40 bg-surfaceAlt accent-soft-text' };
      if (n >= 7) return { label: 'Recurso / Recuperação', code: 'REC', badge: 'border-amberGlow/40 bg-amber-950/35 text-amberGlow' };
      return { label: 'Reprovado', code: 'REP', badge: 'border-roseGlow/40 bg-rose-950/35 text-roseGlow' };
    }

    function buildStudentGradesSeed(baseScore) {
      const map = {};
      SUBJECTS_8_CLASSE.forEach((subj, i) => {
        const offset = ((i % 4) - 1) * 0.7;
        const clamp = (v) => Math.max(4, Math.min(19.5, Math.round(v * 10) / 10));
        map[subj] = {
          t1: { mac: clamp(baseScore + offset), npp: clamp(baseScore + offset - 0.4), npt: clamp(baseScore + offset + 0.3) },
          t2: { mac: clamp(baseScore + offset + 0.3), npp: clamp(baseScore + offset), npt: clamp(baseScore + offset + 0.2) },
          t3: { mac: clamp(baseScore + offset + 0.5), npp: clamp(baseScore + offset + 0.2), npt: clamp(baseScore + offset + 0.4) }
        };
      });
      return map;
    }

    function getStudentOverallAverage(student) {
      if (!student || !student.grades) return 0;
      const subjs = Object.keys(student.grades);
      if (!subjs.length) return 0;
      const sum = subjs.reduce((acc, s) => acc + calcFinalSubjectAverage(student.grades[s]), 0);
      return Math.round((sum / subjs.length) * 10) / 10;
    }

    function createInitialState() {
      return {
        // Papel ativo: 'student' (padrão limpo) | '1841' (Docente) | '2013' (Engenharia/Sistema) | '2012' (Moderação Chat)
        activeRole: 'student',
        ui: {
          activeTab: 'academy',
          sagaOpen: false,
          currentStudentId: 'AUR-2026-0801',
          selectedSubject: 'Matemática',
          selectedTrimester: 't1',
          selectedLessonId: 'mat-01',
          searchQuery: ''
        },
        frontendReform: JSON.parse(JSON.stringify(DEFAULT_FRONTEND_REFORM)),
        lastSafeSnapshot: JSON.parse(JSON.stringify(DEFAULT_FRONTEND_REFORM)),
        schoolMeta: {
          institution: 'Complexo Escolar EXorg MT — Sistema Áurea',
          academicYear: '2026',
          classe: '8.ª Classe',
          curso: 'Ensino Secundário Geral (I Ciclo)',
          turma: '8.ª B • Turno Manhã',
          director: 'Sófocles Hilinawa',
          patron: 'Baptista Antônio'
        },
        // Configuração técnica isolada (só acessível no passe 2013)
        techConfig: {
          apiKey: '',
          selectedModel: 'gemini-2.5-flash-lite',
          showKeyPlain: false,
          testing: false,
          diagnostics: {
            statusText: 'Motor Híbrido Pronto',
            httpCode: '—',

    function loadAppState() {
      const def = createInitialState();
      const raw = storageRead(STORE_KEY);
      if (!raw) return def;
      try {
        const parsed = JSON.parse(raw);
        return {
          ...def,
          ...parsed,
          activeRole: parsed.activeRole || 'student',
          ui: { ...def.ui, ...(parsed.ui || {}) },
          frontendReform: { ...def.frontendReform, ...(parsed.frontendReform || {}) },
          lastSafeSnapshot: { ...def.lastSafeSnapshot, ...(parsed.lastSafeSnapshot || {}) },
          schoolMeta: { ...def.schoolMeta, ...(parsed.schoolMeta || {}) },
          techConfig: {
            ...def.techConfig,
            ...(parsed.techConfig || {}),
            testing: false,
            diagnostics: {
              ...def.techConfig.diagnostics,
              ...((parsed.techConfig && parsed.techConfig.diagnostics) || {})
            }
          },
          students: Array.isArray(parsed.students) && parsed.students.length ? parsed.students : def.students,
          academyLessons: Array.isArray(parsed.academyLessons) ? parsed.academyLessons : def.academyLessons,
          lado0: { ...def.lado0, ...(parsed.lado0 || {}) },
          managerTasks: Array.isArray(parsed.managerTasks) ? parsed.managerTasks : def.managerTasks,
          publicChat: { ...def.publicChat, ...(parsed.publicChat || {}) },
          sagaMessages: Array.isArray(parsed.sagaMessages) && parsed.sagaMessages.length ? parsed.sagaMessages : def.sagaMessages
        };
      } catch (e) {
        return def;
      }
    }

    let appState = loadAppState();

      storageWrite(STORE_KEY, JSON.stringify(appState));

    function pushSystemLog(level, detail) {
      if (!appState.techConfig.systemLogs) appState.techConfig.systemLogs = [];
      appState.techConfig.systemLogs.unshift({
        id: Date.now() + Math.floor(Math.random() * 100),
        at: nowFullDateTime(),
        level,
        detail
      });
      if (appState.techConfig.systemLogs.length > 60) {
        appState.techConfig.systemLogs = appState.techConfig.systemLogs.slice(0, 60);
      }
    }

    // =========================================================================
    // MOTOR DE AUTO-REFORMA SEGURA DO FRONTEND (SagaFrontendReformer)
    // =========================================================================
    const SagaFrontendReformer = {
      validateIntegrity() {
        // Garante que nenhuma reforma ocultou ou destruiu elementos vitais ou o isolamento de segurança
        const requiredIds = ['appHeader', 'mainNavBar', 'mainViewport', 'sagaDrawer', 'pinAccessModal'];
        const missing = requiredIds.filter(id => !document.getElementById(id));
        if (missing.length > 0) {
          this.rollback('Integridade de estrutura protegida');
          return false;
        }
        return true;
      },

      saveSnapshot(label) {
        const current = JSON.parse(JSON.stringify(appState.frontendReform));
        delete current.reformHistory;
        appState.lastSafeSnapshot = current;
        if (!Array.isArray(appState.frontendReform.reformHistory)) {
          appState.frontendReform.reformHistory = [];
        }
        appState.frontendReform.reformHistory.unshift({
          at: nowClock(),
          label
        });
        if (appState.frontendReform.reformHistory.length > 15) {
          appState.frontendReform.reformHistory = appState.frontendReform.reformHistory.slice(0, 15);
        }
      },

      applyToDOM() {
        const ref = appState.frontendReform || DEFAULT_FRONTEND_REFORM;
        const root = document.documentElement;

        // 1. Modo claro/escuro
        if (ref.surfaceMode === 'light') {
          root.classList.add('theme-light');
          root.classList.remove('dark');
        } else {
          root.classList.remove('theme-light');
          root.classList.add('dark');
        }

        // 2. Paleta de destaque
        const hex = ref.accentHex || '#38bdf8';
        const soft = ref.accentSoft || '#7dd3fc';
        root.style.setProperty('--accent-hex', hex);
        root.style.setProperty('--accent-soft', soft);

        const clean = hex.replace('#', '');
        if (clean.length === 6) {
          const r = parseInt(clean.slice(0, 2), 16);
          const g = parseInt(clean.slice(2, 4), 16);
          const b = parseInt(clean.slice(4, 6), 16);
          root.style.setProperty('--accent-ring', `rgba(${r}, ${g}, ${b}, 0.35)`);
          root.style.setProperty('--accent-tint', `rgba(${r}, ${g}, ${b}, 0.14)`);
        }

        // 3. Escala tipográfica segura (entre 0.90 e 1.22 para nunca quebrar layouts mobile)
        const safeScale = Math.max(0.9, Math.min(1.22, Number(ref.uiScale) || 1));
        root.style.setProperty('--ui-scale', String(safeScale));

        // 4. Densidade dos cartões
        if (ref.density === 'compact') {
          root.style.setProperty('--card-radius', '1rem');
          root.style.setProperty('--card-pad', '0.9rem');
        } else if (ref.density === 'spacious') {
          root.style.setProperty('--card-radius', '2rem');
          root.style.setProperty('--card-pad', '1.6rem');
        } else {
          root.style.setProperty('--card-radius', '1.5rem');
          root.style.setProperty('--card-pad', '1.25rem');
        }

        this.syncThemeModalUI();
        this.validateIntegrity();
      },

      syncThemeModalUI() {
        const presetsBox = document.getElementById('themePresetsBox');
        if (!presetsBox) return;
        const hex = appState.frontendReform.accentHex || '#38bdf8';
        presetsBox.innerHTML = THEME_OPTIONS.map(t => {
          const active = t.hex.toLowerCase() === hex.toLowerCase();
          return `
            <button type="button" data-action="set-theme-preset" data-hex="${t.hex}" data-soft="${t.soft}" data-name="${escapeHtml(t.name)}" class="tactile-btn flex items-center gap-2 rounded-xl border ${active ? 'border-accent bg-surfaceAlt' : 'border-borderLine bg-surface'} px-3 py-2.5 text-xs font-bold text-white">
              <span class="h-4 w-4 rounded-full" style="background:${t.hex}"></span>
              <span>${escapeHtml(t.name)}</span>
            </button>
          `;
        }).join('');
      },

      reform(patch, description) {
        this.saveSnapshot(description || 'Ajuste visual');
        appState.frontendReform = {
          ...appState.frontendReform,
          ...patch
        };
        this.applyToDOM();
        pushSystemLog('REFORM', `Auto-reforma frontend aplicada: ${description}`);
        saveAppState();
        renderNavigationAndHeader();
        renderActiveView();
      },

      rollback(reason = 'Visual original restaurado') {
        const snap = appState.lastSafeSnapshot || DEFAULT_FRONTEND_REFORM;
        const history = appState.frontendReform.reformHistory || [];
        appState.frontendReform = {
          ...JSON.parse(JSON.stringify(DEFAULT_FRONTEND_REFORM)),
          ...JSON.parse(JSON.stringify(snap)),
          reformHistory: history
        };
        this.applyToDOM();
        pushSystemLog('ROLLBACK', reason);
        saveAppState();
        renderNavigationAndHeader();
        renderActiveView();
        showToast(reason, 'info');
      },

      resetToFactory() {
        this.saveSnapshot('Reposição de fábrica');
        appState.frontendReform = JSON.parse(JSON.stringify(DEFAULT_FRONTEND_REFORM));
        this.applyToDOM();
        pushSystemLog('REFORM', 'Frontend reposto na configuração original de apresentação.');
        saveAppState();
        renderNavigationAndHeader();
        renderActiveView();
        showToast('Visual original do Sistema Áurea restaurado.', 'success');
      }
    };

    // =========================================================================
    // CONEXÃO GEMINI SILENCIOSA (ATIVA APENAS SE CONFIGURADA NO PASSE 2013)
    // =========================================================================
    function sanitizeApiKey(raw) {
      return String(raw || '').replace(/[\s\u200B-\u200D\uFEFF]/g, '').trim();
    }

    async function fetchWithAbort(url, options, timeoutMs = 10000) {
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => {
        if (controller) {
          try { controller.abort(); } catch (e) {}
        }
      }, timeoutMs);

      try {
        return await fetch(url, {
          ...options,
          signal: controller ? controller.signal : undefined
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function callGeminiSilent(promptText, systemPrompt, overrideKey = null, overrideModel = null) {
      const cleanKey = sanitizeApiKey(overrideKey !== null ? overrideKey : appState.techConfig.apiKey);
      if (!cleanKey) throw new Error('Sem chave configurada');

      const models = [
        overrideModel || appState.techConfig.selectedModel || 'gemini-2.5-flash-lite',
        'gemini-2.5-flash-lite',
        'gemini-2.5-flash'
      ].filter((v, i, arr) => arr.indexOf(v) === i);

      const payload = {
        systemInstruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role: 'user', parts: [{ text: promptText }] }],
        generationConfig: { temperature: 0.5, maxOutputTokens: 600 }
      };

      let lastErr = null;
      for (let i = 0; i < models.length; i += 1) {
        const model = models[i];
        const baseUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;

        for (let attempt = 0; attempt < 2; attempt += 1) {
          const useQuery = attempt === 1;
          const url = useQuery ? `${baseUrl}?key=${encodeURIComponent(cleanKey)}` : baseUrl;
          const headers = { 'Content-Type': 'application/json' };
          if (!useQuery) headers['x-goog-api-key'] = cleanKey;

          try {
            const t0 = performance.now();
            const resp = await fetchWithAbort(url, {
              method: 'POST',
              mode: 'cors',
              credentials: 'omit',
              headers,
              body: JSON.stringify(payload)
            }, 10000);
            const latency = Math.max(1, Math.round(performance.now() - t0));
            const json = await resp.json().catch(() => null);

            if (!resp.ok) {
              const msg = json && json.error && json.error.message ? json.error.message : `HTTP ${resp.status}`;
              const err = new Error(msg);
              err.httpCode = resp.status;
              err.latencyMs = latency;
              err.transport = useQuery ? 'Query ?key=' : 'Header x-goog-api-key';
              throw err;
            }

            const parts = json && json.candidates && json.candidates[0] && json.candidates[0].content && json.candidates[0].content.parts;
            const text = Array.isArray(parts) ? parts.map(p => p.text || '').join('\n').trim() : '';
            if (!text) throw new Error('Resposta vazia');

            return {
              text,
              httpCode: resp.status,
              latencyMs: latency,
              modelUsed: model,
              transport: useQuery ? 'Query ?key=' : 'Header x-goog-api-key'
            };
          } catch (e) {
            lastErr = e;
          }
        }
      }
      throw lastErr || new Error('Ligação externa indisponível');
    }

    // =========================================================================
    // MOTOR EDUCACIONAL & AUTO-REFORMA S.A.G.A. (ZERO MENÇÃO TÉCNICA AO ALUNO)
    // =========================================================================
    function tryApplyFrontendReformFromPrompt(promptText) {
      const lower = promptText.toLowerCase();

      // Restauro / Rollback
      if (/(restaurar|voltar|desfazer|repor).*(visual|layout|tema|original|antes)/i.test(lower)) {
        SagaFrontendReformer.resetToFactory();
        return 'Restaurei o visual original do Sistema Áurea para ti. Tudo está limpo e organizado.';
      }

      // Modo claro / escuro
      if (/(modo claro|tema claro|fundo claro|branco)/i.test(lower)) {
        SagaFrontendReformer.reform({ surfaceMode: 'light' }, 'Ativação de Modo Claro');
        return 'Alterei o ambiente para o Modo Claro para facilitar a leitura. Se quiseres voltar atrás, basta dizer "restaurar visual".';
      }
      if (/(modo escuro|tema escuro|fundo escuro|noturno)/i.test(lower)) {
        SagaFrontendReformer.reform({ surfaceMode: 'dark' }, 'Ativação de Modo Escuro');
        return 'Alterei o ambiente para o Modo Escuro confortável para os olhos.';
      }

      // Cores
      if (/(esmeralda|verde)/i.test(lower) && /(cor|tema|visual|muda|põe|coloca)/i.test(lower)) {
        SagaFrontendReformer.reform({ accentName: 'Esmeralda', accentHex: '#34d399', accentSoft: '#6ee7b7' }, 'Cor Esmeralda');
        return 'Apliquei a paleta Esmeralda em todo o ecossistema!';
      }
      if (/(ouro|âmbar|ambar|amarelo|dourado)/i.test(lower) && /(cor|tema|visual|muda|põe|coloca)/i.test(lower)) {
        SagaFrontendReformer.reform({ accentName: 'Ouro Solar', accentHex: '#fbbf24', accentSoft: '#fde68a' }, 'Cor Ouro Solar');
        return 'Apliquei a paleta Ouro Solar em todo o ecossistema!';
      }
      if (/(violeta|roxo|lilás)/i.test(lower) && /(cor|tema|visual|muda|põe|coloca)/i.test(lower)) {
        SagaFrontendReformer.reform({ accentName: 'Violeta', accentHex: '#a78bfa', accentSoft: '#ddd6fe' }, 'Cor Violeta');
        return 'Apliquei a paleta Violeta em todo o ecossistema!';
      }
      if (/(ciano|azul)/i.test(lower) && /(cor|tema|visual|muda|põe|coloca)/i.test(lower)) {
        SagaFrontendReformer.reform({ accentName: 'Ciano Áurea', accentHex: '#38bdf8', accentSoft: '#7dd3fc' }, 'Cor Ciano Áurea');
        return 'Apliquei a paleta Ciano Áurea em todo o ecossistema!';
      }

      // Tamanho da letra
      if (/(aumenta|maior|grande).*(letra|fonte|texto)/i.test(lower)) {
        const nextScale = Math.min(1.2, (appState.frontendReform.uiScale || 1) + 0.08);
        SagaFrontendReformer.reform({ uiScale: nextScale }, `Ampliação de tipografia (${Math.round(nextScale * 100)}%)`);
        return `Aumentei o tamanho da letra para ${Math.round(nextScale * 100)}% para facilitar a leitura na tela.`;
      }
      if (/(diminui|menor|pequena|normal).*(letra|fonte|texto)/i.test(lower)) {
        SagaFrontendReformer.reform({ uiScale: 1 }, 'Tipografia padrão (100%)');
        return 'Ajustei o tamanho da letra de volta para o padrão confortável (100%).';
      }

      // Densidade
      if (/(compacto|compacta|condensado)/i.test(lower)) {
        SagaFrontendReformer.reform({ density: 'compact' }, 'Densidade compacta');
        return 'Organizei os cartões em formato mais compacto para caber mais informação no ecrã.';
      }
      if (/(espaçoso|espacoso|amplo|arejado)/i.test(lower)) {
        SagaFrontendReformer.reform({ density: 'spacious' }, 'Densidade espaçosa');
        return 'Aumentei o espaçamento dos cartões para uma leitura mais tranquila.';
      }

      return null;
    }

    function buildEducationalLocalReply(promptText) {
      const q = String(promptText || '').trim();
      const lower = q.toLowerCase();
      const currentStudent = appState.students.find(s => s.id === appState.ui.currentStudentId) || appState.students[0];

      // 1. Verifica se é um pedido de reforma visual do frontend
      const reformReply = tryApplyFrontendReformFromPrompt(q);
      if (reformReply) return reformReply;

      // 2. Cálculos matemáticos rápidos
      const expr = lower
        .replace(/quanto\s+(é|e)\s+/g, '')
        .replace(/calcula\s+/g, '')
        .replace(/,/g, '.')
        .replace(/×/g, '*')
        .replace(/÷/g, '/');
      if (/^[0-9+\-*/().\s]+$/.test(expr) && /[+\-*/]/.test(expr)) {
        try {
          const val = Function('"use strict";return (' + expr + ')')();
          if (typeof val === 'number' && Number.isFinite(val)) {
            return `O resultado de (${expr.trim()}) é ${val.toLocaleString('pt-AO')}. Se quiseres, explico o passo a passo da resolução.`;
          }
        } catch (e) {}
      }

      // 3. Notas e desempenho do aluno
      if (/(nota|média|media|boletim|aproveitamento|desempenho)/i.test(lower)) {
        const avg = getStudentOverallAverage(currentStudent);
        const cls = classifyScore20(avg);
        const list = SUBJECTS_8_CLASSE.slice(0, 5).map(s =>
          `• ${s}: ${calcFinalSubjectAverage(currentStudent.grades[s]).toFixed(1)} val.`
        );
        return [
          `Resumo Académico de ${currentStudent.name} (${currentStudent.classe}):`,
          `• Média Geral Atual: ${avg.toFixed(1)} / 20 valores — ${cls.label}`,
          ...list,
          `Podes ver todas as disciplinas e trimestres na aba "Boletim & Notas".`
        ].join('\n');
      }

      // 4. Plano de estudo
      if (/(plano|estudo|organizar|estudar|prova|matéria|materia)/i.test(lower)) {
        return [
          `Plano de Estudo Sugerido para a ${appState.schoolMeta.classe}:`,
          `• Segunda & Quarta (40 min): Matemática e Física — resolver exercícios práticos de equações e MRU.`,
          `• Terça & Quinta (35 min): Química e Biologia — rever a tabela periódica e a estrutura celular.`,
          `• Sexta-feira (30 min): Língua Portuguesa e História — leitura interpretativa e resumos.`,
          `• Dica: marca cada bloco concluído no teu espaço "Lado 0" e "Manager".`
        ].join('\n');
      }

      // 5. Explicações de matérias da 8.ª classe
      if (/(equaç|equac|1\.º grau|x\b)/i.test(lower)) {
        return `Para resolver uma equação do 1.º grau (ex.: 2x + 6 = 14):\n1. Passa o +6 para o outro membro trocando o sinal: 2x = 14 - 6.\n2. Simplifica: 2x = 8.\n3. Divide pelo coeficiente de x: x = 8 ÷ 2 → x = 4.\nNa aba Academy tens uma aula completa sobre este tema!`;
      }

      if (/(física|fisica|mru|velocidade)/i.test(lower)) {
        return `No Movimento Retilíneo Uniforme (MRU), a velocidade média calcula-se por v = Δs ÷ Δt.\nLembra-te: para passar de km/h para m/s basta dividir por 3,6 (por exemplo, 72 km/h ÷ 3,6 = 20 m/s).`;
      }

      return `Estou aqui para te ajudar nos estudos da ${appState.schoolMeta.classe}, ${currentStudent.name.split(' ')[0]}! Podes pedir-me:\n• Resumo das tuas notas e médias;\n• Explicações de Matemática, Física, Química ou Biologia;\n• Um plano de estudo semanal;\n• Ou pedir para ajustar as cores, o modo claro/escuro e o tamanho da letra do ecrã.`;
    }

    async function handleSagaSubmit(rawText) {
      const text = String(rawText || '').trim();
      if (!text) return;

      // Comando discreto opcional para abrir o modal de PIN sem botões visíveis
      if (text.toLowerCase() === '/acesso' || text.toLowerCase() === '/pin') {
        appState.ui.sagaOpen = false;
        renderSagaDrawer();
        openPinModal();
        return;
      }

      appState.sagaMessages.push({
        id: Date.now(),
        role: 'user',
        time: nowClock(),
        text
      });
      renderSagaDrawer();

      // Verifica primeiro se é uma reforma visual imediata
      const immediateReform = tryApplyFrontendReformFromPrompt(text);
      if (immediateReform) {
        appState.sagaMessages.push({
          id: Date.now() + 1,
          role: 'assistant',
          time: nowClock(),
          text: immediateReform
        });
        saveAppState();
        renderSagaDrawer();
        return;
      }

      let replyText = '';
      const hasExternalKey = Boolean(sanitizeApiKey(appState.techConfig.apiKey));

      if (hasExternalKey) {
        try {
          const stu = appState.students.find(s => s.id === appState.ui.currentStudentId) || appState.students[0];
          const sysPrompt = [
            `És o S.A.G.A., tutor educativo do Sistema Áurea (EXorg MT) em Angola.`,
            `Responde em português claro, acolhedor e pedagógico para um estudante da ${appState.schoolMeta.classe} (${stu.name}, média ${getStudentOverallAverage(stu).toFixed(1)}/20).`,
            `Nunca menciones termos técnicos de programação, API, chaves ou servidores.`
          ].join(' ');
          const res = await callGeminiSilent(text, sysPrompt);
          replyText = res.text;
          appState.techConfig.diagnostics = {
            statusText: `Ligação Ativa (${res.modelUsed})`,
            httpCode: String(res.httpCode),
            latencyMs: res.latencyMs,
            transportUsed: res.transport,
            modelUsed: res.modelUsed,
            lastCheckedAt: nowFullDateTime(),
            errorDetail: 'Operacional'
          };
        } catch (err) {
          appState.techConfig.diagnostics = {
            statusText: 'Motor Local em Operação',
            httpCode: String(err.httpCode || 'OFFLINE'),
            latencyMs: err.latencyMs || 0,
            transportUsed: err.transport || 'Local',
            modelUsed: appState.techConfig.selectedModel,
            lastCheckedAt: nowFullDateTime(),
            errorDetail: err.message || 'Sem ligação externa'
          };
          replyText = buildEducationalLocalReply(text);
        }
      } else {
        replyText = buildEducationalLocalReply(text);
      }

      appState.sagaMessages.push({
        id: Date.now() + 1,
        role: 'assistant',
        time: nowClock(),
        text: replyText
      });

      saveAppState();
      renderSagaDrawer();
    }

    // =========================================================================
    // EVENTOS DE INTERAÇÃO, PIN SECRETO E INICIALIZAÇÃO
    // =========================================================================
    let brandTapCount = 0;
    let brandTapTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      const brandTrigger = document.getElementById('institutionalBrandTrigger');
      if (brandTrigger) {
        brandTrigger.addEventListener('click', () => {
          brandTapCount += 1;
          clearTimeout(brandTapTimer);
          if (brandTapCount >= 2) {
            brandTapCount = 0;
            openPinModal();
            return;
          }
          brandTapTimer = setTimeout(() => {
            brandTapCount = 0;
          }, 420);
        });
      }

      SagaFrontendReformer.applyToDOM();
      renderNavigationAndHeader();
      renderSagaDrawer();
      renderActiveView();
    });

    document.addEventListener('click', async (e) => {
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn && tabBtn.dataset.tab) {
        appState.ui.activeTab = tabBtn.dataset.tab;
        saveAppState();
        renderNavigationAndHeader();
        renderActiveView();
        return;
      }

      const quickSaga = e.target.closest('[data-saga-quick]');
      if (quickSaga && quickSaga.dataset.sagaQuick) {
        appState.ui.sagaOpen = true;
        renderSagaDrawer();
        await handleSagaSubmit(quickSaga.dataset.sagaQuick);
        return;
      }

      const actBtn = e.target.closest('[data-action]');
      if (!actBtn) return;
      const action = actBtn.dataset.action;

      switch (action) {
        case 'toggle-saga':
          appState.ui.sagaOpen = !appState.ui.sagaOpen;
          saveAppState();
          renderSagaDrawer();
          break;

        case 'clear-saga-chat':
          appState.sagaMessages = [
            {
              id: Date.now(),
              role: 'assistant',
              time: nowClock(),
              text: 'Conversa limpa. Como te posso ajudar agora nos estudos ou no visual do Sistema Áurea?'
            }
          ];
          saveAppState();
          renderSagaDrawer();
          break;

        case 'saga-rollback-ui':
          SagaFrontendReformer.resetToFactory();
          break;

        case 'open-theme-modal': {
          SagaFrontendReformer.syncThemeModalUI();
          const m = document.getElementById('themeModal');
          if (m) { m.classList.remove('hidden'); m.classList.add('flex'); }
          break;
        }

        case 'close-theme-modal': {
          const m = document.getElementById('themeModal');
          if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
          break;
        }

        case 'close-pin-modal':
          closePinModal();
          break;

        case 'exit-restricted-role':
          activateRole('student');
          break;

        case 'set-theme-preset':
          SagaFrontendReformer.reform({
            accentName: actBtn.dataset.name || 'Ciano Áurea',
            accentHex: actBtn.dataset.hex || '#38bdf8',
            accentSoft: actBtn.dataset.soft || '#7dd3fc'
          }, `Paleta ${actBtn.dataset.name || 'Personalizada'}`);
          showToast(`Ambiente ${actBtn.dataset.name} aplicado.`, 'success');
          break;

        case 'set-surface-mode':
          SagaFrontendReformer.reform({
            surfaceMode: actBtn.dataset.mode === 'light' ? 'light' : 'dark'
          }, `Modo ${actBtn.dataset.mode === 'light' ? 'Claro' : 'Escuro'}`);
          break;

        case 'set-density':
          SagaFrontendReformer.reform({
            density: actBtn.dataset.density || 'comfortable'
          }, `Densidade ${actBtn.dataset.density}`);
          break;

        case 'set-ui-scale':
          SagaFrontendReformer.reform({
            uiScale: Number(actBtn.dataset.scale) || 1
          }, `Escala ${Math.round((Number(actBtn.dataset.scale) || 1) * 100)}%`);
          break;

        case 'select-lesson':
          appState.ui.selectedLessonId = actBtn.dataset.lid;
          saveAppState();
          renderActiveView();
          break;

        case 'toggle-lesson-done': {
          const ls = (appState.academyLessons || []).find(l => l.id === actBtn.dataset.lid);
          if (ls) {
            ls.completed = !ls.completed;
            saveAppState();
            renderActiveView();
            showToast(ls.completed ? 'Aula marcada como concluída!' : 'Aula reaberta para revisão.', 'success');
          }
          break;
        }

        case 'add-focus-session':
          appState.lado0.focusMinutesToday = Number(appState.lado0.focusMinutesToday || 0) + 25;
          saveAppState();
          renderActiveView();
          showToast('+25 minutos de foco adicionados ao teu registo de hoje!', 'success');
          break;

        case 'toggle-habit': {
          const hb = (appState.lado0.habits || []).find(h => h.id === actBtn.dataset.hid);
          if (hb) {
            hb.done = !hb.done;
            saveAppState();
            renderActiveView();
          }
          break;
        }

        case 'toggle-manager-task': {
          const tk = (appState.managerTasks || []).find(t => t.id === actBtn.dataset.tid);
          if (tk) {
            tk.done = !tk.done;
            saveAppState();
            renderActiveView();
          }
          break;
        }

        case 'delete-manager-task':
          appState.managerTasks = (appState.managerTasks || []).filter(t => t.id !== actBtn.dataset.tid);
          saveAppState();
          renderActiveView();
          showToast('Tarefa removida.', 'info');
          break;

        // Ações Passe 1841 (Docente)
        case 'doc-att': {
          if (appState.activeRole !== '1841') return;
          const st = appState.students.find(s => s.id === actBtn.dataset.uid);
          const kind = actBtn.dataset.kind;
          if (st && st.attendance && Object.prototype.hasOwnProperty.call(st.attendance, kind)) {
            st.attendance[kind] = Number(st.attendance[kind] || 0) + 1;
            saveAppState();
            renderActiveView();
            showToast(`Assiduidade atualizada para ${st.name}.`, 'success');
          }
          break;
        }

        // Ações Passe 2012 (Moderação)
        case 'mod-delete-msg': {
          if (appState.activeRole !== '2012') return;
          const mid = Number(actBtn.dataset.mid);
          appState.publicChat.messages = (appState.publicChat.messages || []).filter(m => m.id !== mid);
          pushSystemLog('MOD-2012', `Mensagem #${mid} removida do mural público.`);
          saveAppState();
          renderActiveView();
          showToast('Mensagem removida do chat público.', 'info');
          break;
        }

        case 'mod-clear-all-chat':
          if (appState.activeRole !== '2012') return;
          appState.publicChat.messages = [];
          pushSystemLog('MOD-2012', 'Mural público limpo pela moderação.');
          saveAppState();
          renderActiveView();
          showToast('Mural público limpo.', 'info');
          break;

        case 'mod-toggle-mute': {
          if (appState.activeRole !== '2012') return;
          const uid = actBtn.dataset.uid;
          const list = appState.publicChat.mutedStudentIds || [];
          if (list.includes(uid)) {
            appState.publicChat.mutedStudentIds = list.filter(x => x !== uid);
          } else {
            appState.publicChat.mutedStudentIds = [...list, uid];
          }
          saveAppState();
          renderActiveView();
          showToast('Permissão de escrita atualizada.', 'info');
          break;
        }

        // Ações Passe 2013 (Núcleo Técnico)
        case 'tech-toggle-key':
          if (appState.activeRole !== '2013') return;
          appState.techConfig.showKeyPlain = !appState.techConfig.showKeyPlain;
          saveAppState();
          renderActiveView();
          break;

        case 'tech-clear-api':
          if (appState.activeRole !== '2013') return;
          appState.techConfig.apiKey = '';
          appState.techConfig.diagnostics.statusText = 'Chave Removida';
          appState.techConfig.diagnostics.httpCode = '—';
          saveAppState();
          renderActiveView();
          showToast('Chave removida do núcleo técnico.', 'info');
          break;

        case 'tech-test-api': {
          if (appState.activeRole !== '2013' || appState.techConfig.testing) return;
          const inp = document.getElementById('techApiKeyInput');
          const sel = document.getElementById('techModelSelect');
          const key = sanitizeApiKey(inp ? inp.value : appState.techConfig.apiKey);
          const model = sel ? sel.value : appState.techConfig.selectedModel;

          appState.techConfig.apiKey = key;
          appState.techConfig.selectedModel = model;

          if (!key) {
            showToast('Introduz uma chave válida antes de testar.', 'warn');
            return;
          }

          appState.techConfig.testing = true;
          renderActiveView();

          try {
            const res = await callGeminiSilent('Responde OK', 'Sistema Áurea', key, model);
            appState.techConfig.testing = false;
            appState.techConfig.diagnostics = {
              statusText: `Online (${res.modelUsed})`,
              httpCode: String(res.httpCode),
              latencyMs: res.latencyMs,
              transportUsed: res.transport,
              modelUsed: res.modelUsed,
              lastCheckedAt: nowFullDateTime(),
              errorDetail: `Ligação confirmada (${res.latencyMs}ms).`
            };
            pushSystemLog('API-2013', `Teste OK (${res.modelUsed}, ${res.latencyMs}ms).`);
            saveAppState();
            renderActiveView();
            showToast(`Ligação confirmada (${res.latencyMs}ms)!`, 'success');
          } catch (err) {
            appState.techConfig.testing = false;
            appState.techConfig.diagnostics = {
              statusText: 'Fallback Local Ativo',
              httpCode: String(err.httpCode || 'ERR'),
              latencyMs: err.latencyMs || 0,
              transportUsed: err.transport || 'Local',
              modelUsed: model,
              lastCheckedAt: nowFullDateTime(),
              errorDetail: err.message || 'Falha externa'
            };
            pushSystemLog('API-2013', `Falha no teste: ${err.message}`);
            saveAppState();
            renderActiveView();
            showToast('Ligação externa indisponível; motor local operacional.', 'warn');
          }
          break;
        }

        case 'export-backup-2013': {
          if (appState.activeRole !== '2013') return;
          const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `aurea-snapshot-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Snapshot exportado!', 'success');
          break;
        }

        case 'run-self-test-2013': {
          if (appState.activeRole !== '2013') return;
          const ok = SagaFrontendReformer.validateIntegrity();
          pushSystemLog('TEST-2013', `Prova de integridade estrutural: ${ok ? 'APROVADA' : 'RESTAURADA'}.`);
          saveAppState();
          renderActiveView();
          showToast('Prova de integridade concluída com sucesso!', 'success');
          break;
        }
      }
    });

    document.addEventListener('submit', async (e) => {
      const form = e.target;
      if (!form || !form.id) return;
      e.preventDefault();

      if (form.id === 'pinAccessForm') {
        const val = (document.getElementById('pinCodeInput').value || '').trim();
        if (val === '1841' || val === '2013' || val === '2012') {
          closePinModal();
          activateRole(val);
        } else {
          showToast('Código inválido.', 'error');
          const inp = document.getElementById('pinCodeInput');
          if (inp) { inp.value = ''; inp.focus(); }
        }
      } else if (form.id === 'sagaChatForm') {
        const inp = document.getElementById('sagaPromptInput');
        const txt = inp ? inp.value.trim() : '';
        if (!txt) return;
        inp.value = '';
        await handleSagaSubmit(txt);
      } else if (form.id === 'lado0ReflectionForm') {
        const val = (document.getElementById('lado0ReflectionInput').value || '').trim();
        appState.lado0.dailyReflection = val;
        saveAppState();
        showToast('Reflexão guardada no teu espaço Lado 0!', 'success');
      } else if (form.id === 'newTaskForm') {
        const title = (document.getElementById('taskTitleInp').value || '').trim();
        const subj = document.getElementById('taskSubjSel').value;
        if (!title) return;
        appState.managerTasks.unshift({
          id: `t-${Date.now()}`,
          title,
          subject: subj,
          due: 'Esta semana',
          priority: 'Normal',
          done: false
        });
        saveAppState();
        renderActiveView();
        showToast('Tarefa adicionada ao Manager!', 'success');
      } else if (form.id === 'publicChatForm') {
        const inp = document.getElementById('publicChatInput');
        const txt = (inp ? inp.value : '').trim();
        if (!txt) return;
        const stu = appState.students.find(s => s.id === appState.ui.currentStudentId) || appState.students[0];
        if ((appState.publicChat.mutedStudentIds || []).includes(stu.id)) return;

        appState.publicChat.messages.push({
          id: Date.now(),
          senderId: stu.id,
          senderName: stu.name,
          roleTag: 'Estudante',
          time: nowClock(),
          text: txt
        });
        inp.value = '';
        saveAppState();
        renderActiveView();
      } else if (form.id === 'techApiForm') {
        if (appState.activeRole !== '2013') return;
        const key = sanitizeApiKey(document.getElementById('techApiKeyInput').value);
        const model = document.getElementById('techModelSelect').value;
        appState.techConfig.apiKey = key;
        appState.techConfig.selectedModel = model;
        appState.techConfig.diagnostics.modelUsed = model;
        appState.techConfig.diagnostics.statusText = key ? `Configurado (${model})` : 'Motor Local Ativo';
        pushSystemLog('API-2013', 'Parâmetros atualizados no Núcleo Técnico.');
        saveAppState();
        renderActiveView();
        showToast('Configuração guardada no Núcleo Técnico.', 'success');
      } else if (form.id === 'modPinNoticeForm') {
        if (appState.activeRole !== '2012') return;
        appState.publicChat.pinnedNotice = (document.getElementById('modPinNoticeInput').value || '').trim();
        pushSystemLog('MOD-2012', 'Aviso fixado atualizado no chat público.');
        saveAppState();
        renderActiveView();
        showToast('Aviso oficial fixado no mural!', 'success');
      }
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      if (!t) return;

      if (t.id === 'docenteSubjSel') {
        appState.ui.selectedSubject = t.value;
        saveAppState();
        renderActiveView();
      } else if (t.id === 'docenteTrimSel') {
        appState.ui.selectedTrimester = t.value;
        saveAppState();
        renderActiveView();
      } else if (t.classList.contains('doc-grade-input')) {
        if (appState.activeRole !== '1841') return;
        const uid = t.dataset.docUid;
        const field = t.dataset.docField;
        const subj = appState.ui.selectedSubject;
        const trim = appState.ui.selectedTrimester;
        const val = Math.max(0, Math.min(20, Number(t.value) || 0));

        const st = appState.students.find(s => s.id === uid);
        if (st && st.grades && st.grades[subj] && st.grades[subj][trim]) {
          st.grades[subj][trim][field] = val;
          saveAppState();
          renderActiveView();
        }
      } else if (t.classList.contains('doc-note-input')) {
        if (appState.activeRole !== '1841') return;
        const st = appState.students.find(s => s.id === t.dataset.docNoteUid);
        if (st) {
          st.pedagogicalNote = t.value;
          saveAppState();
          showToast('Observação pedagógica guardada.', 'success');
        }
      }
    });
  </script>
</body>
</html>
