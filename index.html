
<!DOCTYPE html>
<html lang="pt-AO" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sistema Áurea — Projeto EXorg MT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#080b10',
            slateDark: '#0f1520',
            surface: '#161f2e',
            surfaceAlt: '#1e293b',
            borderLine: '#283548',
            cyanGlow: '#38bdf8',
            emeraldGlow: '#10b981',
            amberGlow: '#f59e0b'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: #080b10;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Botões grandes, táteis e com resposta imediata */
    button,
    select,
    input,
    textarea,
    [role="button"] {
      touch-action: manipulation;
    }

    .tactile-btn {
      min-height: 46px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, background-color 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, filter 0.12s ease;
    }

    .tactile-btn:hover {
      filter: brightness(1.07);
    }

    .tactile-btn:active {
      transform: scale(0.96);
      filter: brightness(0.92);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.45);
    }

    /* Scrollbar discreta */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b1018;
    }
    ::-webkit-scrollbar-thumb {
      background: #2b394f;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }

    /* Animações suaves */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes sagaTopBlink {
      0%, 100% {
        opacity: 1;
        border-color: rgba(56, 189, 248, 0.85);
        box-shadow: 0 0 22px rgba(56, 189, 248, 0.28);
      }
      50% {
        opacity: 0.42;
        border-color: rgba(245, 158, 11, 0.85);
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.25);
      }
    }

    @keyframes pulseBeacon {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.55; }
    }

    .anim-view {
      animation: fadeSlideUp 0.22s ease-out forwards;
    }

    .saga-top-blink {
      animation: sagaTopBlink 0.9s infinite ease-in-out;
    }

    .beacon-dot {
      animation: pulseBeacon 2s infinite ease-in-out;
    }

    .nav-tab-btn.active {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.16) 0%, rgba(16, 185, 129, 0.05) 100%);
      border-color: rgba(56, 189, 248, 0.5);
      color: #ffffff;
    }

    .nav-tab-btn.active .nav-dot {
      background-color: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }
  </style>
</head>
<body class="min-h-screen bg-obsidian text-slate-100 antialiased selection:bg-cyanGlow/25 selection:text-cyanGlow">

  <!-- Notificações não-bloqueantes (pointer-events-none no contentor) -->
  <div id="toastStack" class="pointer-events-none fixed top-4 right-4 z-[90] flex w-full max-w-sm flex-col gap-2 px-4 sm:px-0"></div>

  <!-- ===================================================================== -->
  <!-- 1. ECRÃ INICIAL DE ENTRADA / REGISTO / ACESSO GESTÃO & DIREÇÃO        -->
  <!-- ===================================================================== -->
  <section id="authScreen" class="relative flex min-h-screen items-center justify-center p-4 sm:p-6">
    <!-- Fundo decorativo estritamente não-interativo -->
    <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 bg-[radial-gradient(circle_at_top_right,rgba(56,189,248,0.09),transparent_42%),radial-gradient(circle_at_bottom_left,rgba(16,185,129,0.07),transparent_44%)]"></div>

    <div class="anim-view relative z-10 w-full max-w-xl rounded-2xl border border-borderLine bg-slateDark/95 p-6 sm:p-8 shadow-2xl">
      <!-- Cabeçalho limpo -->
      <div class="flex items-center justify-between gap-3 border-b border-borderLine pb-5">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-xl border border-cyanGlow/40 bg-surface font-bold text-lg text-cyanGlow">
            Á
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight text-white">Sistema Áurea</h1>
            <p class="text-xs text-slate-400">Ambiente Escolar Isolado • 7.ª à 12.ª Classe</p>
          </div>
        </div>
        <span class="rounded-lg border border-borderLine bg-surface px-2.5 py-1 font-mono text-[11px] font-semibold text-cyanGlow">
          EXorg MT
        </span>
      </div>

      <!-- Seletor de Abas de Autenticação -->
      <div class="mt-5 grid grid-cols-3 gap-1.5 rounded-xl border border-borderLine bg-obsidian p-1.5">
        <button type="button" data-auth-tab="student-login" class="auth-tab-btn tactile-btn rounded-lg bg-surfaceAlt px-2 py-2 text-xs font-bold text-white shadow">
          Entrar (Aluno)
        </button>
        <button type="button" data-auth-tab="student-register" class="auth-tab-btn tactile-btn rounded-lg px-2 py-2 text-xs font-semibold text-slate-400 hover:text-white">
          Criar Conta
        </button>
        <button type="button" data-auth-tab="staff-access" class="auth-tab-btn tactile-btn rounded-lg px-2 py-2 text-xs font-semibold text-slate-400 hover:text-white">
          Gestão / Direção
        </button>
      </div>

      <!-- MODO A: ENTRAR COMO ALUNO -->
      <form id="formStudentLogin" class="mt-6 space-y-4">
        <div>
          <label for="stuLoginId" class="mb-1.5 block text-xs font-semibold text-slate-300">ID do Aluno</label>
          <input
            id="stuLoginId"
            type="text"
            required
            autocomplete="username"
            placeholder="Ex.: AUR-2026-1042"
            class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-4 py-2.5 font-mono text-sm uppercase text-white placeholder-slate-500 focus:border-cyanGlow focus:outline-none"
          />
        </div>

        <div>
          <label for="stuLoginPass" class="mb-1.5 block text-xs font-semibold text-slate-300">Palavra-passe</label>
          <input
            id="stuLoginPass"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Introduza a palavra-passe"
            class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyanGlow focus:outline-none"
          />
        </div>

        <button type="submit" class="tactile-btn w-full rounded-xl bg-cyanGlow px-4 py-3 text-sm font-bold text-obsidian hover:bg-sky-300">
          Entrar na Minha Turma
        </button>

        <div class="pt-2 border-t border-borderLine/70 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2">
          <button type="button" data-action="quick-demo-student" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3.5 py-2 text-xs font-semibold text-slate-200 hover:border-cyanGlow/50">
            Entrar com Aluno Exemplo (10.ª CEJ)
          </button>
          <button type="button" data-auth-tab="student-register" class="tactile-btn rounded-xl border border-emeraldGlow/35 bg-emerald-950/25 px-3.5 py-2 text-xs font-semibold text-emeraldGlow hover:bg-emerald-950/45">
            Gerar Novo ID Agora
          </button>
        </div>
      </form>

      <!-- MODO B: CRIAR CONTA DE ALUNO (GERA ID ÚNICO NA HORA) -->
      <form id="formStudentRegister" class="mt-6 hidden space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label for="regFullName" class="mb-1.5 block text-xs font-semibold text-slate-300">Nome do Aluno</label>
            <input
              id="regFullName"
              type="text"
              required
              placeholder="Ex.: Carla Francisco"
              class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyanGlow focus:outline-none"
            />
          </div>

          <div>
            <label for="regPassword" class="mb-1.5 block text-xs font-semibold text-slate-300">Palavra-passe</label>
            <input
              id="regPassword"
              type="password"
              required
              minlength="4"
              placeholder="Crie uma senha"
              class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:border-cyanGlow focus:outline-none"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label for="regClasse" class="mb-1.5 block text-xs font-semibold text-slate-300">Classe (7.ª à 12.ª)</label>
            <select id="regClasse" class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-3.5 py-2.5 text-sm text-white focus:border-cyanGlow focus:outline-none">
              <option value="7.ª Classe">7.ª Classe</option>
              <option value="8.ª Classe">8.ª Classe</option>
              <option value="9.ª Classe">9.ª Classe</option>
              <option value="10.ª Classe" selected>10.ª Classe</option>
              <option value="11.ª Classe">11.ª Classe</option>
              <option value="12.ª Classe">12.ª Classe</option>
            </select>
          </div>

          <div>
            <label for="regCurso" class="mb-1.5 block text-xs font-semibold text-slate-300">Curso / Área</label>
            <select id="regCurso" class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-3.5 py-2.5 text-sm text-white focus:border-cyanGlow focus:outline-none"></select>
          </div>
        </div>

        <button type="submit" class="tactile-btn w-full rounded-xl bg-emeraldGlow px-4 py-3 text-sm font-bold text-obsidian hover:bg-emerald-400">
          Criar Conta de Aluno e Entrar
        </button>
      </form>

      <!-- MODO C: ACESSO GESTÃO / DIREÇÃO (SEM DICAS OU EXPOSIÇÃO DE PASSES) -->
      <form id="formStaffAccess" class="mt-6 hidden space-y-4">
        <div>
          <label for="staffNameInput" class="mb-1.5 block text-xs font-semibold text-slate-300">Identificação / Nome</label>
          <input
            id="staffNameInput"
            type="text"
            required
            autocomplete="off"
            placeholder="Introduza a sua identificação"
            class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-amberGlow focus:outline-none"
          />
        </div>

        <div>
          <label for="staffPassInput" class="mb-1.5 block text-xs font-semibold text-slate-300">Passe de Acesso</label>
          <input
            id="staffPassInput"
            type="password"
            required
            autocomplete="off"
            placeholder="••••••••"
            class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-4 py-2.5 font-mono text-sm text-white placeholder-slate-500 focus:border-amberGlow focus:outline-none"
          />
        </div>

        <button type="submit" class="tactile-btn w-full rounded-xl bg-amberGlow px-4 py-3 text-sm font-bold text-obsidian hover:bg-amber-400">
          Validar Acesso
        </button>
      </form>
    </div>
  </section>

  <!-- ===================================================================== -->
  <!-- 2. ÁREA DE TRABALHO IMERSIVA (FOCO TOTAL NA TELA ATIVA)               -->
  <!-- ===================================================================== -->
  <div id="workspaceShell" class="hidden min-h-screen flex-col">
    <!-- Barra Superior Compacta -->
    <header class="sticky top-0 z-30 border-b border-borderLine bg-slateDark/95 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-3 py-2.5 sm:px-5">
        <div class="flex items-center gap-2.5 min-w-0">
          <button type="button" data-action="toggle-menu" class="tactile-btn flex items-center gap-2 rounded-xl border border-borderLine bg-surface px-3.5 py-2 text-xs font-bold text-white hover:border-cyanGlow/50">
            <span class="font-mono text-cyanGlow">☰</span>
            <span>Menu</span>
          </button>

          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span id="topModuleTitle" class="truncate text-sm sm:text-base font-bold text-white">Áurea Academy</span>
              <span id="topRoleBadge" class="hidden sm:inline-block rounded-md border border-cyanGlow/35 bg-cyanGlow/10 px-2 py-0.5 font-mono text-[10px] font-bold uppercase text-cyanGlow">
                ALUNO
              </span>
            </div>
            <p id="topContextLine" class="truncate text-[11px] text-slate-400">10.ª Classe • CEJ</p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <button type="button" data-action="open-context-modal" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3 py-2 text-xs font-semibold text-slate-200 hover:border-cyanGlow/50">
            Classe / Curso
          </button>
          <button type="button" data-action="logout" class="tactile-btn rounded-xl border border-rose-500/35 bg-rose-950/35 px-3 py-2 text-xs font-bold text-rose-200 hover:bg-rose-900/50">
            Sair
          </button>
        </div>
      </div>
    </header>

    <!-- Gaveta de Navegação Retrátil (Overlay fecha ao clicar fora) -->
    <div id="navDrawerBackdrop" data-action="close-menu" class="fixed inset-0 z-40 hidden bg-black/70 backdrop-blur-xs"></div>

    <aside id="navDrawer" class="fixed inset-y-0 left-0 z-50 hidden w-72 max-w-[85vw] flex-col border-r border-borderLine bg-slateDark p-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-borderLine pb-3.5">
        <div>
          <span class="font-mono text-[10px] font-bold uppercase tracking-wider text-cyanGlow">Sistema Áurea</span>
          <p id="drawerUserName" class="text-sm font-bold text-white truncate">Utilizador</p>
          <p id="drawerUserId" class="font-mono text-[11px] text-slate-400">AUR-2026-0000</p>
        </div>
        <button type="button" data-action="close-menu" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3 py-2 text-xs font-bold text-slate-300 hover:text-white">
          ✕
        </button>
      </div>

      <div class="my-3 rounded-xl border border-borderLine bg-surface/80 p-3 text-xs">
        <span class="block text-[10px] uppercase tracking-wider text-slate-400">Turma Isolada Ativa</span>
        <span id="drawerClasse" class="mt-0.5 block font-bold text-white">10.ª Classe</span>
        <span id="drawerCurso" class="block text-[11px] text-cyanGlow truncate">CEJ</span>
      </div>

      <nav class="flex-1 space-y-1.5 overflow-y-auto" aria-label="Abas do Sistema">
        <button type="button" data-tab="academy" class="nav-tab-btn active tactile-btn flex w-full items-center justify-between rounded-xl border border-transparent px-3.5 py-2.5 text-left text-xs sm:text-sm font-semibold text-slate-300 hover:bg-surface">
          <span class="flex items-center gap-2.5"><span class="nav-dot h-2 w-2 rounded-full bg-slate-600"></span>Áurea Academy</span>
          <span class="font-mono text-[10px] text-cyanGlow">10 Q</span>
        </button>

        <button type="button" data-tab="definitivo" class="nav-tab-btn tactile-btn flex w-full items-center justify-between rounded-xl border border-transparent px-3.5 py-2.5 text-left text-xs sm:text-sm font-semibold text-slate-300 hover:bg-surface">
          <span class="flex items-center gap-2.5"><span class="nav-dot h-2 w-2 rounded-full bg-slate-600"></span>Estudo Definitivo</span>
          <span class="font-mono text-[10px] text-slate-400">Provas</span>
        </button>

        <button type="button" data-tab="lado0" class="nav-tab-btn tactile-btn flex w-full items-center justify-between rounded-xl border border-transparent px-3.5 py-2.5 text-left text-xs sm:text-sm font-semibold text-slate-300 hover:bg-surface">
          <span class="flex items-center gap-2.5"><span class="nav-dot h-2 w-2 rounded-full bg-slate-600"></span>Lado 0</span>
          <span class="font-mono text-[10px] text-emeraldGlow">Leve</span>
        </button>

        <button type="button" data-tab="turma" class="nav-tab-btn tactile-btn flex w-full items-center justify-between rounded-xl border border-transparent px-3.5 py-2.5 text-left text-xs sm:text-sm font-semibold text-slate-300 hover:bg-surface">
          <span class="flex items-center gap-2.5"><span class="nav-dot h-2 w-2 rounded-full bg-slate-600"></span>Chat da Turma</span>
          <span id="drawerTurmaTag" class="font-mono text-[10px] text-slate-400">10.ª</span>
        </button>

        <button type="button" data-tab="manager" class="nav-tab-btn tactile-btn flex w-full items-center justify-between rounded-xl border border-transparent px-3.5 py-2.5 text-left text-xs sm:text-sm font-semibold text-slate-300 hover:bg-surface">
          <span class="flex items-center gap-2.5"><span class="nav-dot h-2 w-2 rounded-full bg-slate-600"></span>Áurea Manager</span>
          <span class="font-mono text-[10px] text-amberGlow">CEJ</span>
        </button>

        <div id="staffNavSection" class="hidden pt-2 mt-2 border-t border-borderLine">
          <button type="button" data-tab="admin" class="nav-tab-btn tactile-btn flex w-full items-center justify-between rounded-xl border border-transparent px-3.5 py-2.5 text-left text-xs sm:text-sm font-semibold text-amberGlow hover:bg-surface">
            <span class="flex items-center gap-2.5"><span class="nav-dot h-2 w-2 rounded-full bg-amberGlow"></span>Painel Gestão / Direção</span>
            <span id="drawerStaffLevelTag" class="font-mono text-[10px]">ATIVO</span>
          </button>
        </div>
      </nav>
    </aside>

    <!-- Área Exclusiva do Módulo Aberto (Sem banners/anúncios externos) -->
    <main id="activeScreenRoot" class="mx-auto w-full max-w-6xl flex-1 p-4 sm:p-6 pb-24"></main>
  </div>

  <!-- ===================================================================== -->
  <!-- 3. MODAL: TROCAR CLASSE / CURSO (ISOLAMENTO IMEDIATO)                 -->
  <!-- ===================================================================== -->
  <div id="contextModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4 backdrop-blur-xs">
    <div class="anim-view w-full max-w-md rounded-2xl border border-borderLine bg-slateDark p-6 shadow-2xl">
      <div class="flex items-center justify-between border-b border-borderLine pb-3">
        <h2 class="text-base font-bold text-white">Selecionar Classe e Curso</h2>
        <button type="button" data-action="close-context-modal" class="tactile-btn rounded-xl border border-borderLine bg-surface px-3 py-1.5 text-xs font-bold text-slate-300 hover:text-white">
          ✕
        </button>
      </div>

      <form id="contextSwitchForm" class="mt-4 space-y-4">
        <div>
          <label for="ctxClasseSelect" class="mb-1.5 block text-xs font-semibold text-slate-300">Classe (7.ª à 12.ª)</label>
          <select id="ctxClasseSelect" class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-3.5 py-2.5 text-sm text-white focus:border-cyanGlow focus:outline-none">
            <option value="7.ª Classe">7.ª Classe</option>
            <option value="8.ª Classe">8.ª Classe</option>
            <option value="9.ª Classe">9.ª Classe</option>
            <option value="10.ª Classe">10.ª Classe</option>
            <option value="11.ª Classe">11.ª Classe</option>
            <option value="12.ª Classe">12.ª Classe</option>
          </select>
        </div>

        <div>
          <label for="ctxCursoSelect" class="mb-1.5 block text-xs font-semibold text-slate-300">Curso / Área</label>
          <select id="ctxCursoSelect" class="min-h-[46px] w-full rounded-xl border border-borderLine bg-surface px-3.5 py-2.5 text-sm text-white focus:border-cyanGlow focus:outline-none"></select>
        </div>

        <button type="submit" class="tactile-btn w-full rounded-xl bg-cyanGlow px-4 py-3 text-xs font-bold text-obsidian hover:bg-sky-300">
          Aplicar Turma Isolada
        </button>
      </form>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- 4. ASSISTENTE FLUTUANTE S.A.G.A. NO CANTO INFERIOR DIREITO            -->
  <!-- ===================================================================== -->
  <div id="sagaFloatingRoot" class="fixed bottom-4 right-4 z-40 hidden flex-col items-end">
    <!-- Janela do Assistente -->
    <div id="sagaPanel" class="anim-view mb-3 hidden w-[calc(100vw-2rem)] max-w-sm rounded-2xl border border-cyanGlow/40 bg-slateDark shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between border-b border-borderLine bg-surface px-4 py-3">
        <div class="flex items-center gap-2.5">
          <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-cyanGlow/15 border border-cyanGlow/40 font-mono text-xs font-bold text-cyanGlow">
            SG
          </span>
          <div>
            <h3 class="text-xs font-bold text-white">Assistente S.A.G.A.</h3>
            <p id="sagaPanelSubtitle" class="text-[10px] text-slate-400">10.ª Classe • Currículo Angola</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button type="button" data-action="saga-quick-quiz" class="tactile-btn rounded-lg border border-borderLine bg-obsidian px-2.5 py-1.5 font-mono text-[10px] font-bold text-cyanGlow hover:border-cyanGlow/50">
            + Questão
          </button>
          <button type="button" data-action="saga-toggle" class="tactile-btn rounded-lg border border-borderLine bg-obsidian px-2.5 py-1.5 text-xs font-bold text-slate-300 hover:text-white">
            —
          </button>
        </div>
      </div>

      <div id="sagaChatFeed" class="h-64 space-y-2.5 overflow-y-auto p-3.5 text-xs"></div>

      <form id="sagaPromptForm" class="flex items-center gap-2 border-t border-borderLine bg-surface/80 p-2.5">
        <input

    /* =======================================================================
     * UTILITÁRIOS GERAIS
     * ======================================================================= */
    function escapeHtml(val) {
      return String(val ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatKz(num) {
      return (Number(num) || 0).toLocaleString('pt-AO') + ' Kz';
    }

    function showToast(message, tone = 'info') {
      const stack = document.getElementById('toastStack');
      if (!stack) return;
      const item = document.createElement('div');
      const colors = {
        info: 'border-cyanGlow/45 text-slate-100',
        success: 'border-emeraldGlow/45 text-emerald-100',
        warn: 'border-amberGlow/50 text-amber-100',
        error: 'border-rose-500/50 text-rose-100'
      };
      const dots = {
        info: 'bg-cyanGlow',
        success: 'bg-emeraldGlow',
        warn: 'bg-amberGlow',
        error: 'bg-rose-500'
      };
      item.className = `anim-view pointer-events-auto flex items-center gap-2.5 rounded-xl border bg-surface/95 px-4 py-3 text-xs shadow-2xl ${colors[tone] || colors.info}`;
      item.innerHTML = `<span class="h-2 w-2 shrink-0 rounded-full ${dots[tone] || dots.info}"></span><span>${escapeHtml(message)}</span>`;
      stack.appendChild(item);

      setTimeout(() => {
        item.style.opacity = '0';
        item.style.transition = 'opacity 0.2s ease';
        setTimeout(() => item.remove(), 220);
      }, 2800);
    }

    function fillCourseOptions(selectEl, classe, currentCourse) {
      if (!selectEl) return;
      const list = COURSES_BY_CLASS[classe] || ['Geral'];
      selectEl.innerHTML = list
        .map(c => `<option value="${escapeHtml(c)}" ${c === currentCourse ? 'selected' : ''}>${escapeHtml(c)}</option>`)
        .join('');
    }

    function generateNewStudentId() {
      let id = '';
      do {
        const n = Math.floor(1000 + Math.random() * 9000);
        id = `AUR-2026-${n}`;
      } while (state.users.some(u => u.id === id));
      return id;
    }

    function isStaffSession() {
      return state.session.role === 'manager2012' || state.session.role === 'director2013';
    }

    function detectStrangePattern(text) {
      const s = String(text || '');
      const lower = s.toLowerCase();
      const triggers = ['http://', 'https://', 'www.', '9999999', 'hack', 'spam', 'senha', 'token', 'apostas'];
      const hasTrigger = triggers.some(t => lower.includes(t));
      const shouting = s.length >= 16 && s === s.toUpperCase() && /[A-ZÁÉÍÓÚÂÊÔÃÕÇ]/.test(s);
      return hasTrigger || shouting;
    }

    function classifyTopic(text, classe) {
      const l = String(text || '').toLowerCase();
      if (l.includes('capital') || l.includes('receita') || l.includes('despesa') || l.includes('cej') || l.includes('empresa')) return 'Gestão Empresarial CEJ';
      if (l.includes('equaç') || l.includes('funç') || l.includes('derivad') || l.includes('integral') || l.includes('fração')) return 'Matemática';
      if (l.includes('prova') || l.includes('exame') || l.includes('revisão')) return 'Preparação de Prova';
      if (detectStrangePattern(text)) return 'Padrão Atípico';
      return `Turma (${classe})`;
    }

    /* =======================================================================
     * CONTROLO DE ECRÃS, MENU E ABAS
     * ======================================================================= */
    function switchAuthTab(tabName) {
      const forms = {
        'student-login': document.getElementById('formStudentLogin'),
        'student-register': document.getElementById('formStudentRegister'),
        'staff-access': document.getElementById('formStaffAccess')
      };

      Object.keys(forms).forEach(key => {
        if (forms[key]) {
          forms[key].classList.toggle('hidden', key !== tabName);
        }
      });

      document.querySelectorAll('.auth-tab-btn').forEach(btn => {
        const active = btn.dataset.authTab === tabName;
        btn.className = active
          ? 'auth-tab-btn tactile-btn rounded-lg bg-surfaceAlt px-2 py-2 text-xs font-bold text-white shadow'
          : 'auth-tab-btn tactile-btn rounded-lg px-2 py-2 text-xs font-semibold text-slate-400 hover:text-white';
      });
    }

    function setMenuOpen(open) {
      state.menuOpen = Boolean(open);
      const drawer = document.getElementById('navDrawer');
      const backdrop = document.getElementById('navDrawerBackdrop');
      if (!drawer || !backdrop) return;

      if (state.menuOpen) {
        drawer.classList.remove('hidden');
        drawer.classList.add('flex');
        backdrop.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
        drawer.classList.remove('flex');
        backdrop.classList.add('hidden');
      }
    }

    function syncInterface() {
      const authScreen = document.getElementById('authScreen');
      const shell = document.getElementById('workspaceShell');
      const sagaRoot = document.getElementById('sagaFloatingRoot');

      if (!state.session.loggedIn) {
        authScreen.classList.remove('hidden');
        shell.classList.add('hidden');
        shell.classList.remove('flex');
        sagaRoot.classList.add('hidden');
        setMenuOpen(false);

      shell.classList.remove('hidden');
      shell.classList.add('flex');

    function openTab(tabKey) {
      if (tabKey === 'admin' && !isStaffSession()) {
        showToast('Acesso restrito ao modo Gestão / Direção.', 'warn');
        return;
      }

      if (!isStaffSession() && (state.systemConfig.lockedModules || []).includes(tabKey)) {
        showToast('Este módulo encontra-se temporariamente bloqueado pela direção.', 'warn');
        return;
      }

      state.activeTab = tabKey;
      setMenuOpen(false);
      saveState();
      syncInterface();
    }

    function renderCurrentTab() {
      const root = document.getElementById('activeScreenRoot');
      if (!root) return;
      root.innerHTML = '';

      switch (state.activeTab) {
        case 'academy':
          renderAcademyView(root);
          break;
        case 'definitivo':
          renderDefinitivoView(root);
          break;
        case 'lado0':
          renderLadoZeroView(root);
          break;
        case 'turma':
          renderTurmaView(root);
          break;
        case 'manager':
          renderManagerView(root);
          break;
        case 'admin':
          renderAdminView(root);
          break;
        default:
          renderAcademyView(root);
      }

    /* -----------------------------------------------------------------------
     * 2. ESTUDO DEFINITIVO (Bateria de Treino Aprofundada por Tema)
     * ----------------------------------------------------------------------- */
    function generateDefinitivoBateria(temaText, nivel, qtd, classe) {
      const parts = String(temaText || '')
        .split(/[,;\n]+/)
        .map(s => s.trim())
        .filter(Boolean);
      const baseTopics = parts.length > 0 ? parts : ['Conteúdo Programático'];
      const total = Math.max(1, Math.min(8, Number(qtd) || 3));
      const result = [];

      for (let i = 0; i < total; i++) {
        const topic = baseTopics[i % baseTopics.length];
        result.push({
          id: i + 1,
          topic,
          nivel,
          openStep: false,
          enunciado: `Exercício ${i + 1} (${classe} • ${topic} — ${nivel}): Analise a situação proposta sobre "${topic}", identifique os dados e conceitos essenciais do programa escolar e desenvolva a solução completa passo a passo.`,
          passos: [
            `Passo 1 — Levantamento de dados e definição teórica de "${topic}" no contexto da ${classe}.`,
            `Passo 2 — Aplicação da fórmula, lei ou estrutura argumentativa correspondente ao nível "${nivel}".`,
            `Passo 3 — Verificação final das unidades, coerência lógica e conclusão fundamentada.`
          ]
        });
      }
      return result;
    }

    /* -----------------------------------------------------------------------

      const wrap = document.createElement('div');

            <span class="text-xs text-slate-400">Total Receitas</span>
            <p class="mt-1 text-lg font-bold text-emeraldGlow">+ ${formatKz(receitas)}</p>

          <div class="rounded-2xl border border-borderLine bg-slateDark p-4">

              ${m.movimentos.map(tx => `

                return `
                  <button type="button" data-action="toggle-module-lock" data-mod="${modKey}" class="tactile-btn flex items-center justify-between rounded-xl border border-borderLine bg-surface px-4 py-3 font-semibold text-white hover:border-amberGlow/50">
                    <span class="uppercase font-mono text-[11px]">${escapeHtml(modKey)}</span>
                    <span class="rounded px-2 py-0.5 font-mono text-[10px] ${locked ? 'bg-rose-950 text-rose-300' : 'bg-emerald-950 text-emeraldGlow'}">
                      ${locked ? 'BLOQUEADO' : 'LIBERADO'}
                    </span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        ` : ''}
      `;

      root.appendChild(wrap);
    }

    /* =======================================================================
     * VARREDURA S.A.G.A. (EXATOS 10 SEGUNDOS POR CONTA + ESCRITA AO VIVO)
     * ======================================================================= */
    function analyzeUserInClass(userId, classe) {
      const msgs = (state.chats[classe] || []).filter(m => m.userId === userId);
      const topics = [...new Set(msgs.map(m => m.topic).filter(Boolean))];
      const edits = msgs.filter(m => m.edited).length;
      const deletions = msgs.filter(m => m.deleted).length;
      const strange = msgs.filter(m => m.flagged || detectStrangePattern(m.text) || detectStrangePattern(m.originalText || '')).length;

      const alertParts = [];
      if (deletions > 0) alertParts.push(`${deletions} eliminada(s)`);
      if (edits > 0) alertParts.push(`${edits} editada(s)`);
      if (strange > 0) alertParts.push('padrão estranho detetado');

      return {
        userId,
        classe,
        topics: topics.length > 0 ? topics.join(', ') : `Sem mensagens (${classe})`,
        edits,
        deletions,
        alerts: alertParts.length > 0 ? alertParts.join(' • ') : 'Sem anomalias.',
        status: alertParts.length > 0 ? 'ALERTA' : 'ESTÁVEL'
      };
    }

    function animateLiveDraftWriting(report) {
      if (liveWriteTimer) clearInterval(liveWriteTimer);
      state.sagaScanner.liveDraft = {
        id: '',
        classe: report.classe,
        topics: '',
        edits: String(report.edits),
        deletions: String(report.deletions),
        alerts: ''
      };

      let step = 0;
      const maxChars = Math.max(report.userId.length, report.topics.length, report.alerts.length);

      liveWriteTimer = setInterval(() => {
        step++;
        state.sagaScanner.liveDraft.id = report.userId.slice(0, step);
        state.sagaScanner.liveDraft.topics = report.topics.slice(0, step);
        state.sagaScanner.liveDraft.alerts = report.alerts.slice(0, step);

        const idField = document.getElementById('sagaLiveId');
        const topField = document.getElementById('sagaLiveTopics');
        const alField = document.getElementById('sagaLiveAlerts');
        if (idField) idField.value = state.sagaScanner.liveDraft.id;
        if (topField) topField.value = state.sagaScanner.liveDraft.topics;
        if (alField) alField.value = state.sagaScanner.liveDraft.alerts;

        if (step >= maxChars) {
          clearInterval(liveWriteTimer);
          liveWriteTimer = null;
        }
      }, 45);
    }

    function startTarget10sWindow(targetId) {
      const scan = state.sagaScanner;
      scan.currentId = targetId;
      scan.secondsLeft = 10; // Exatos 10 segundos por conta

      const report = analyzeUserInClass(targetId, scan.targetClass);
      animateLiveDraftWriting(report);

      const existingIdx = scan.intelligenceTable.findIndex(r => r.userId === report.userId && r.classe === report.classe);
      if (existingIdx >= 0) {
        scan.intelligenceTable[existingIdx] = report;
      } else {
        scan.intelligenceTable.unshift(report);
      }
      saveState();

      if (state.activeTab === 'admin' || state.activeTab === 'turma') {
        renderCurrentTab();
      }
    }

    function startSagaScan(classe) {
      stopSagaScan(true);

      const studentsInClass = state.users.filter(u => u.classe === classe).map(u => u.id);
      const chatIdsInClass = (state.chats[classe] || []).map(m => m.userId).filter(Boolean);
      const queue = [...new Set([...studentsInClass, ...chatIdsInClass])];
      if (queue.length === 0) queue.push('AUR-2026-1042');

      const scan = state.sagaScanner;
      scan.active = true;
      scan.targetClass = classe;
      scan.queue = queue;
      scan.index = 0;

      showToast(`Varredura S.A.G.A. iniciada na ${classe} (10s por conta).`, 'info');
      startTarget10sWindow(queue[0]);

      scanTimer = setInterval(() => {
        if (!state.sagaScanner.active) {
          clearInterval(scanTimer);
          scanTimer = null;
          return;
        }

        if (state.sagaScanner.secondsLeft > 1) {
          state.sagaScanner.secondsLeft -= 1;
          if (state.activeTab === 'admin' || state.activeTab === 'turma') {
            renderCurrentTab();
          }
          return;
        }

        const next = state.sagaScanner.index + 1;
        if (next < state.sagaScanner.queue.length) {
          state.sagaScanner.index = next;
          startTarget10sWindow(state.sagaScanner.queue[next]);
        } else {
          stopSagaScan(false);
          showToast(`Varredura S.A.G.A. concluída (${queue.length} conta(s)).`, 'success');
        }
      }, 1000);
    }

    function stopSagaScan(silent = false) {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }
      if (liveWriteTimer) {
        clearInterval(liveWriteTimer);
        liveWriteTimer = null;
      }
      state.sagaScanner.active = false;
      state.sagaScanner.secondsLeft = 0;
      state.sagaScanner.currentId = '';
      saveState();

      if (!silent && (state.activeTab === 'admin' || state.activeTab === 'turma')) {
        renderCurrentTab();
      }
    }

    /* =======================================================================
     * WIDGET FLUTUANTE S.A.G.A. (CANTO INFERIOR DIREITO)
     * ======================================================================= */
    function renderSagaWidget() {
      const panel = document.getElementById('sagaPanel');
      const feed = document.getElementById('sagaChatFeed');
      if (!panel || !feed) return;

      panel.classList.toggle('hidden', !state.sagaWidget.open);

      feed.innerHTML = (state.sagaWidget.messages || []).map(m => {
        const isSaga = m.sender === 'saga';
        return `
          <div class="rounded-xl border ${isSaga ? 'border-cyanGlow/30 bg-surface' : 'border-borderLine bg-obsidian'} p-2.5">
            <div class="mb-1 flex items-center justify-between text-[10px]">
              <span class="font-mono font-bold ${isSaga ? 'text-cyanGlow' : 'text-emeraldGlow'}">${isSaga ? 'S.A.G.A.' : 'VOCÊ'}</span>
              <span class="font-mono text-slate-500">${escapeHtml(m.time)}</span>
            </div>
            <p class="whitespace-pre-line text-xs leading-relaxed text-slate-100">${escapeHtml(m.text)}</p>
          </div>
        `;
      }).join('');

      feed.scrollTop = feed.scrollHeight;
    }

    function askSagaAssistant(text) {
      const clean = String(text || '').trim();
      if (!clean) return;
      const classe = state.session.classe;
      const curso = state.session.curso;
      const time = new Date().toLocaleTimeString('pt-AO', { hour: '2-digit', minute: '2-digit' });

      state.sagaWidget.messages.push({ sender: 'user', time, text: clean });

      const lower = clean.toLowerCase();
      let reply = '';
      if (lower.includes('questão') || lower.includes('pergunta') || lower.includes('treino')) {
        const bank = ACADEMY_QUESTIONS[classe] || ACADEMY_QUESTIONS['10.ª Classe'];
        const q = bank[Math.floor(Math.random() * bank.length)];
        reply = `Questão (${classe}):\n${q.q}\n\nOpções: ${q.opts.join(' | ')}\n\nNota: ${q.exp}`;
      } else {
        reply = `S.A.G.A. (${classe} • ${curso}):\nSobre "${clean}", revê primeiro o conceito-base do tema e aplica-o num exercício resolvido. Clica em "+ Questão" se quiseres testar agora.`;
      }

      state.sagaWidget.messages.push({ sender: 'saga', time, text: reply });
      saveState();
      renderSagaWidget();
    }

    /* =======================================================================
     * DELEGAÇÃO CENTRALIZADA DE CLIQUES / TOQUES E FORMULÁRIOS
     * ======================================================================= */
    document.addEventListener('click', (event) => {
      const authTabBtn = event.target.closest('[data-auth-tab]');
      if (authTabBtn) {
        event.preventDefault();
        switchAuthTab(authTabBtn.dataset.authTab);
        return;
      }

      const tabBtn = event.target.closest('[data-tab]');
      if (tabBtn) {
        event.preventDefault();
        openTab(tabBtn.dataset.tab);
        return;
      }

      const actionBtn = event.target.closest('[data-action]');
      if (!actionBtn) return;

      const action = actionBtn.dataset.action;

      switch (action) {
        case 'quick-demo-student': {
          const demo = state.users[0];
          state.session = {
            loggedIn: true,
            role: 'student',
            userId: demo.id,
            userName: demo.name,
            classe: demo.classe,
            curso: demo.curso
          };
          state.activeTab = 'academy';
          saveState();
          showToast(`Bem-vindo, ${demo.name} (${demo.id}).`, 'success');
          syncInterface();
          break;
        }

        case 'toggle-menu':
          setMenuOpen(!state.menuOpen);
          break;

        case 'close-menu':
          setMenuOpen(false);
          break;

        case 'logout':
          stopSagaScan(true);
          state.session.loggedIn = false;
          state.session.role = 'student';
          state.sagaWidget.open = false;
          saveState();
          showToast('Sessão encerrada.', 'info');
          syncInterface();
          break;

        case 'open-context-modal': {
          const modal = document.getElementById('contextModal');
          const clsSel = document.getElementById('ctxClasseSelect');
          const curSel = document.getElementById('ctxCursoSelect');
          clsSel.value = state.session.classe;
          fillCourseOptions(curSel, state.session.classe, state.session.curso);
          modal.classList.remove('hidden');
          modal.classList.add('flex');
          break;
        }

        case 'close-context-modal': {
          const modal = document.getElementById('contextModal');
          modal.classList.add('hidden');
          modal.classList.remove('flex');
          break;
        }

        case 'academy-pick': {
          const qIdx = Number(actionBtn.dataset.q);
          const oIdx = Number(actionBtn.dataset.o);
          state.academy.answers[qIdx] = oIdx;
          saveState();
          renderCurrentTab();
          break;
        }

        case 'academy-reset':
          state.academy.answers = {};
          state.academy.submitted = false;
          saveState();
          showToast('Questões reiniciadas.', 'info');
          renderCurrentTab();
          break;

        case 'academy-finish':
          state.academy.submitted = true;
          saveState();
          showToast('Avaliação concluída!', 'success');
          renderCurrentTab();
          break;

        case 'def-toggle-steps': {
          const id = Number(actionBtn.dataset.id);
          const item = (state.definitivo.bateria || []).find(x => x.id === id);
          if (item) {
            item.openStep = !item.openStep;
            saveState();
            renderCurrentTab();
          }
          break;
        }

        case 'lado0-pick': {
          const q = Number(actionBtn.dataset.q);
          const o = Number(actionBtn.dataset.o);
          state.lado0.answers[q] = o;
          saveState();
          renderCurrentTab();
          break;
        }

        case 'lado0-complete':
          state.lado0.completed = true;
          saveState();
          showToast('Pausa ativa concluída!', 'success');
          renderCurrentTab();
          break;

        case 'lado0-new':
          initLadoZeroRound();
          saveState();
          renderCurrentTab();
          break;

        case 'simulate-classmate-msg': {
          const cls = state.session.classe;
          if (!state.chats[cls]) state.chats[cls] = [];
          const samples = [
            'Alguém pode confirmar a fórmula principal desta matéria?',
            'Já concluí os 10 exercícios diários na Áurea Academy!',
            'Vamos rever este tópico antes do teste da semana.'
          ];
          const text = samples[Math.floor(Math.random() * samples.length)];
          const simId = `AUR-2026-${Math.floor(2000 + Math.random() * 7000)}`;
          state.chats[cls].push({
            id: Date.now(),
            userId: simId,
            author: `Colega da Turma • ${simId}`,
            time: new Date().toLocaleTimeString('pt-AO', { hour: '2-digit', minute: '2-digit' }),
            text,
            topic: classifyTopic(text, cls),
            edited: false,
            deleted: false,
            flagged: false
          });
          saveState();
          renderCurrentTab();
          break;
        }

        case 'chat-edit': {
          const cls = state.session.classe;
          const msgId = Number(actionBtn.dataset.id);
          const target = (state.chats[cls] || []).find(m => m.id === msgId);
          if (target && !target.deleted) {
            target.originalText = target.originalText || target.text;
            target.text = `${target.text} (editado às ${new Date().toLocaleTimeString('pt-AO', { hour: '2-digit', minute: '2-digit' })})`;
            target.edited = true;
            saveState();
            showToast('Mensagem editada.', 'info');
            renderCurrentTab();
          }
          break;
        }

        case 'chat-delete': {
          const cls = state.session.classe;
          const msgId = Number(actionBtn.dataset.id);
          const target = (state.chats[cls] || []).find(m => m.id === msgId);
          if (target && !target.deleted) {
            target.originalText = target.originalText || target.text;
            target.text = '[MENSAGEM ELIMINADA PELO UTILIZADOR]';
            target.deleted = true;
            target.flagged = true;
            saveState();
            showToast('Mensagem eliminada e registada para auditoria.', 'warn');
            renderCurrentTab();
          }
          break;
        }

        case 'mgr-toggle-task': {
          const tid = actionBtn.dataset.id;
          const task = state.manager.tarefas.find(t => t.id === tid);
          if (task) {
            task.done = !task.done;
            saveState();
            renderCurrentTab();
          }
          break;
        }

        case 'start-saga-scan': {
          const sel = document.getElementById('adminClassSelector');
          const cls = actionBtn.dataset.classe || (sel ? sel.value : state.session.classe);
          startSagaScan(cls);
          break;
        }

        case 'stop-saga-scan':
          stopSagaScan(false);
          showToast('Varredura S.A.G.A. interrompida.', 'info');
          break;

        case 'inspect-target-chat': {
          const sel = document.getElementById('adminClassSelector');
          if (sel) state.session.classe = sel.value;
          openTab('turma');
          break;
        }

        case 'user-toggle-status': {
          const uid = actionBtn.dataset.id;
          const u = state.users.find(x => x.id === uid);
          if (u) {
            u.status = u.status === 'ativo' ? 'suspenso' : 'ativo';
            saveState();
            showToast(`Conta ${u.id} agora está ${u.status}.`, 'info');
            renderCurrentTab();
          }
          break;
        }

        case 'user-remove': {
          const uid = actionBtn.dataset.id;
          state.users = state.users.filter(x => x.id !== uid);
          saveState();
          showToast(`Conta ${uid} removida.`, 'warn');
          renderCurrentTab();
          break;
        }

        case 'toggle-module-lock': {
          const mod = actionBtn.dataset.mod;
          const locked = state.systemConfig.lockedModules || [];
          if (locked.includes(mod)) {
            state.systemConfig.lockedModules = locked.filter(x => x !== mod);
          } else {
            state.systemConfig.lockedModules = [...locked, mod];
          }
          saveState();
          renderCurrentTab();
          break;
        }

        case 'system-full-reset':
          stopSagaScan(true);
          state = buildInitialState();
          saveState();
          showToast('Sistema reposto para os dados iniciais.', 'info');
          syncInterface();
          break;

        case 'saga-toggle':
          state.sagaWidget.open = !state.sagaWidget.open;
          saveState();
          renderSagaWidget();
          break;

        case 'saga-quick-quiz':
          state.sagaWidget.open = true;
          askSagaAssistant('Gera uma questão prática agora');
          break;
      }
    });

    /* =======================================================================
     * SUBMISSÃO DE FORMULÁRIOS E ALTERAÇÃO DE SELECTS
     * ======================================================================= */
    document.addEventListener('submit', (event) => {
      const form = event.target;
      if (!form || !form.id) return;
      event.preventDefault();

      switch (form.id) {
        case 'formStudentLogin': {
          const idVal = document.getElementById('stuLoginId').value.trim().toUpperCase();
          const passVal = document.getElementById('stuLoginPass').value;
          const found = state.users.find(u => u.id === idVal && u.password === passVal);

          if (!found) {
            showToast('ID ou palavra-passe incorretos.', 'error');
            return;
          }
          if (found.status !== 'ativo') {
            showToast('Esta conta encontra-se suspensa pela gestão.', 'error');
            return;
          }

          state.session = {
            loggedIn: true,
            role: 'student',
            userId: found.id,
            userName: found.name,
            classe: found.classe,
            curso: found.curso
          };
          state.activeTab = 'academy';
          saveState();
          showToast(`Sessão iniciada: ${found.name}.`, 'success');
          syncInterface();
          break;
        }

        case 'formStudentRegister': {
          const name = document.getElementById('regFullName').value.trim();
          const password = document.getElementById('regPassword').value;
          const classe = document.getElementById('regClasse').value;
          const curso = document.getElementById('regCurso').value;

          if (!name || !password) {
            showToast('Preencha o nome e a palavra-passe.', 'warn');
            return;
          }

          const newId = generateNewStudentId();
          state.users.push({
            id: newId,
            name,
            password,
            classe,
            curso,
            status: 'ativo'
          });

          state.session = {
            loggedIn: true,
            role: 'student',
            userId: newId,
            userName: name,
            classe,
            curso
          };
          state.activeTab = 'academy';
          state.academy = { answers: {}, submitted: false };
          saveState();
          showToast(`Conta criada! O teu ID é ${newId}.`, 'success');
          syncInterface();
          break;
        }

        case 'formStaffAccess': {
          const staffName = document.getElementById('staffNameInput').value.trim() || 'Direção Áurea';
          const passCode = document.getElementById('staffPassInput').value.trim();

          if (passCode !== '2012' && passCode !== '2013') {
            showToast('Passe de acesso inválida.', 'error');
            return;
          }

          const is2013 = passCode === '2013';
          state.session = {
            loggedIn: true,
            role: is2013 ? 'director2013' : 'manager2012',
            userId: is2013 ? 'DIR-2026-001' : 'GST-2026-002',
            userName: staffName,
            classe: state.session.classe || '10.ª Classe',
            curso: state.session.curso || 'Ciências Económicas e Jurídicas - CEJ'
          };
          state.activeTab = 'admin';
          document.getElementById('staffPassInput').value = '';
          saveState();
          showToast(is2013 ? 'Acesso de Direção Total ativado.' : 'Acesso de Gestão de Contas & Chats ativado.', 'success');
          syncInterface();
          break;
        }

        case 'contextSwitchForm': {
          const newClasse = document.getElementById('ctxClasseSelect').value;
          const newCurso = document.getElementById('ctxCursoSelect').value;
          state.session.classe = newClasse;
          state.session.curso = newCurso;
          state.academy = { answers: {}, submitted: false };

          const u = state.users.find(x => x.id === state.session.userId);
          if (u) {
            u.classe = newClasse;
            u.curso = newCurso;
          }

          document.getElementById('contextModal').classList.add('hidden');
          document.getElementById('contextModal').classList.remove('flex');
          saveState();
          showToast(`Turma isolada para ${newClasse}.`, 'info');
          syncInterface();
          break;
        }

        case 'formDefinitivo': {
          state.definitivo.tema = document.getElementById('defTemaInput').value.trim();
          state.definitivo.nivel = document.getElementById('defNivelSelect').value;
          state.definitivo.quantidade = Number(document.getElementById('defQtdSelect').value);
          state.definitivo.bateria = generateDefinitivoBateria(
            state.definitivo.tema,
            state.definitivo.nivel,
            state.definitivo.quantidade,
            state.session.classe
          );
          saveState();
          showToast('Bateria de treino gerada.', 'success');
          renderCurrentTab();
          break;
        }

        case 'formTurmaChat': {
          const input = document.getElementById('turmaChatInput');
          const text = input.value.trim();
          if (!text) return;

          const cls = state.session.classe;
          if (!state.chats[cls]) state.chats[cls] = [];

          state.chats[cls].push({
            id: Date.now(),
            userId: state.session.userId,
            author: `${state.session.userName} • ${state.session.userId}`,
            time: new Date().toLocaleTimeString('pt-AO', { hour: '2-digit', minute: '2-digit' }),
            text,
            topic: classifyTopic(text, cls),
            edited: false,
            deleted: false,
            flagged: detectStrangePattern(text)
          });
          input.value = '';
          saveState();
          renderCurrentTab();
          break;
        }

        case 'formManagerTx': {
          const desc = document.getElementById('mgrDescInput').value.trim();
          const tipo = document.getElementById('mgrTipoSelect').value;
          const valor = Number(document.getElementById('mgrValorInput').value);
          if (!desc || valor <= 0) return;

          state.manager.movimentos.unshift({
            id: Date.now(),
            desc,
            tipo,
            valor
          });
          saveState();
          showToast('Movimento financeiro registado.', 'success');
          renderCurrentTab();
          break;
        }

        case 'sagaPromptForm': {
          const input = document.getElementById('sagaPromptInput');
          const val = input.value.trim();
          if (!val) return;
          input.value = '';
          askSagaAssistant(val);
          break;
        }
      }
    });

    document.addEventListener('change', (event) => {
      const target = event.target;
      if (!target) return;

      if (target.id === 'regClasse') {
        fillCourseOptions(document.getElementById('regCurso'), target.value, COURSES_BY_CLASS[target.value][0]);
      } else if (target.id === 'ctxClasseSelect') {
        fillCourseOptions(document.getElementById('ctxCursoSelect'), target.value, COURSES_BY_CLASS[target.value][0]);
      } else if (target.id === 'adminClassSelector') {
        state.sagaScanner.targetClass = target.value;
        saveState();
      }
    });

    function bootstrapApp() {
      try {
        const regClasse = document.getElementById('regClasse');
        const regCurso = document.getElementById('regCurso');
        if (regClasse && regCurso) {
          fillCourseOptions(regCurso, regClasse.value, COURSES_BY_CLASS[regClasse.value][0]);
        }
        syncInterface();
      } catch (err) {
        state = buildInitialState();
        syncInterface();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapApp);
    } else {
      bootstrapApp();
    }
  </script>
